        if (r.locked) return baseFor(r);
        if (settings.rules[r.key]) return settings.rules[r.key];
        const p = settings.policy[type];
        if (p === 'ALLOW' || p === 'BLOCK') return p;
        return baseFor(r);
      };
      const isOn = (g, r) => !(g.settings ? disabledSettings[r.key] : disabledRules[r.key]);
      const setOn = (g, r, on) => {
        const field = g.settings ? 'disabledSettings' : 'disabledRules';
        const next = { ...(config[field] || {}) };
        if (on) delete next[r.key]; else next[r.key] = true;
        setConfig({ ...config, [field]: next });
      };
      const setAll = (g, on) => {
        const field = g.settings ? 'disabledSettings' : 'disabledRules';
        const next = { ...(config[field] || {}) };
        g.rules.forEach(r => { if (on) delete next[r.key]; else next[r.key] = true; });
        if (g.settings) { if (on) delete next['advancedThreatProtection:blockedCountries']; else next['advancedThreatProtection:blockedCountries'] = true; }
        setConfig({ ...config, [field]: next });
      };
      const atpGroup = (catalog || []).find(g => g.type === 'advancedThreatProtection');
      const countries = Array.isArray(config.blockedCountries) ? config.blockedCountries : (atpGroup ? atpGroup.blockedCountries : []);
      const setCountries = (list) => setConfig({ ...config, blockedCountries: list });
      const countriesOn = !disabledSettings['advancedThreatProtection:blockedCountries'];

      const isWeakened = (type, r) => !r.locked && isRestrictiveAction(r.defaultAction) && effective(type, r) === 'ALLOW';
      const weakenedCount = (catalog || []).filter(g => g.canOverride).reduce((n, g) => n + g.rules.filter(r => isOn(g, r) && isWeakened(g.type, r)).length, 0);
      const offCount = Object.keys(disabledRules).length + Object.keys(disabledSettings).length;
      const total = (catalog || []).reduce((n, g) => n + g.rules.length, 0);

      const handleGenerate = async () => {
        setLoading(true); setError(null);
        try { setTemplate(await api.call('POST', '/templates/generate', config)); onNext(); }
        catch (e) { setError(e.message); }
        setLoading(false);
      };
      const Sw = ({ on, onClick, testId }) => (<div className={`toggle-switch ${on ? 'active' : ''}`} onClick={onClick} data-ruletoggle={testId} style={{flexShrink:0}}><div className="toggle-knob"></div></div>);

      return (
        <div className="card">
          <div className="card-header">
            <h2>Rules</h2>
            <p>Every rule and setting the framework will create. Switch any of them off; where a policy type supports it, choose Allow or Block.</p>
          </div>
          {catalog && <div className="alert alert-info">ℹ {total - offCount} of {total} rules and settings on{offCount > 0 && <> · {offCount} switched off</>}.</div>}
          {weakenedCount > 0 && <div className="alert alert-warning">⚠ {weakenedCount} rule{weakenedCount === 1 ? '' : 's'} the framework would restrict {weakenedCount === 1 ? 'is' : 'are'} set to Allow. This is flagged in the plan and recorded in the audit log.</div>}
          {!catalog ? (
            <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div></div>
          ) : catalog.length === 0 ? (
            <div className="alert alert-warning">No policy areas are enabled. Go back to Customize.</div>
          ) : catalog.map(g => {
            const pol = settings.policy[g.type] || 'DEFAULT';
            const onCount = g.rules.filter(r => isOn(g, r)).length;
            return (
              <div className="ab-group" key={g.type} data-rulegroup={g.type}>
                <div className="ab-group-header" onClick={() => setOpen({ ...open, [g.type]: !open[g.type] })}>
                  <div>
                    <div className="ab-group-title">{open[g.type] ? '▾' : '▸'} {g.label}</div>
                    <div className="ab-group-sub">{onCount} of {g.rules.length} on{g.settings && countriesOn && countries.length ? ` · ${countries.length} blocked countries` : ''}</div>
                  </div>
                  <div style={{display:'flex', gap:'8px', alignItems:'center'}} onClick={e => e.stopPropagation()}>
                    <div className="ab-seg">
                      <button className={onCount === g.rules.length ? 'on-default' : ''} onClick={() => setAll(g, true)}>All on</button>
                      <button className={onCount === 0 ? 'on-block' : ''} onClick={() => setAll(g, false)}>All off</button>
                    </div>
                    {g.canOverride && (
                      <div className="ab-seg">
                        <button className={pol === 'DEFAULT' ? 'on-default' : ''} onClick={() => setPolicy(g.type, 'DEFAULT')}>Default</button>
                        <button className={pol === 'ALLOW' ? 'on-allow' : ''} onClick={() => setPolicy(g.type, 'ALLOW')}>Allow all</button>
                        <button className={pol === 'BLOCK' ? 'on-block' : ''} onClick={() => setPolicy(g.type, 'BLOCK')}>Block all</button>
                      </div>
                    )}
                  </div>
                </div>
                {open[g.type] && (
                  <div className="ab-rows">
                    {g.rules.map(r => {
                      const on = isOn(g, r);
                      const eff = g.canOverride ? effective(g.type, r) : null;
                      return (
                        <div className="ab-row" key={r.key} data-rule={r.key} style={{opacity: on ? 1 : 0.5}}>
                          <Sw on={on} onClick={() => setOn(g, r, !on)} testId={r.key} />
                          <div style={{flex:1, minWidth:0}}>
                            <div className="ab-row-name">{r.name}{r.sheet && <span className="badge badge-category" style={{marginLeft:'6px', fontSize:'9px'}}>{r.sheet}</span>}</div>
                            {r.description && <div className="ab-row-desc">{r.description}</div>}
                            <div className="ab-row-desc">
                              Default: <strong>{g.settings ? (r.defaultAction === 'BLOCK' ? 'Block' : 'Allow') : (r.defaultActions ? r.defaultActions.join(', ') : r.defaultAction)}</strong>
                              {r.categoryCount !== undefined && <> · {r.categoryCount} categories{r.isolateAllOthers ? ' (rebuilt from the tenant at dry run)' : ''}</>}
                            </div>
                            {on && g.canOverride && isWeakened(g.type, r) && <div className="ab-warn">⚠ Weaker than the framework default</div>}
                            {r.locked && <div className="ab-row-desc">🔒 Required for baseline internet access; Allow/Block can't be changed</div>}
                          </div>
                          {g.canOverride && on && !r.isolate && (
                            <div className="ab-seg">
                              <button disabled={r.locked} className={eff === 'ALLOW' ? 'on-allow' : ''} onClick={() => setRule(g.type, r, 'ALLOW')}>Allow</button>
                              <button disabled={r.locked} className={eff === 'BLOCK' ? 'on-block' : ''} onClick={() => setRule(g.type, r, 'BLOCK')}>Block</button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {g.settings && (
                      <div className="ab-row" data-countries style={{alignItems:'flex-start', opacity: countriesOn ? 1 : 0.5}}>
                        <Sw on={countriesOn} onClick={() => setOn({ settings: true }, { key: 'advancedThreatProtection:blockedCountries' }, !countriesOn)} testId="advancedThreatProtection:blockedCountries" />
                        <div style={{flex:1}}>
                          <div className="ab-row-name">Block countries (Suspicious Destinations Protection)</div>
                          <div className="ab-row-desc">Added to anything the tenant already blocks; nothing is unblocked.</div>
                          <div style={{display:'flex', flexWrap:'wrap', gap:'6px', marginTop:'6px'}}>
                            {countries.map(c => (
                              <span key={c} className="badge badge-risk" style={{cursor:'pointer'}} title="Remove" onClick={() => setCountries(countries.filter(x => x !== c))}>
                                {COUNTRY_NAMES[c] || c.replace('COUNTRY_', '')} ✕
                              </span>
                            ))}
                            {countries.length === 0 && <span className="ab-row-desc">No countries blocked.</span>}
                          </div>
                          <div style={{display:'flex', gap:'6px', marginTop:'6px'}}>
                            <input type="text" value={newCountry} placeholder="ISO code, e.g. SY" maxLength={2} style={{width:'120px'}}
                              onChange={e => setNewCountry(e.target.value.toUpperCase().replace(/[^A-Z]/g, ''))} />
                            <button className="btn btn-ghost btn-sm" disabled={newCountry.length !== 2} onClick={() => { const c = 'COUNTRY_' + newCountry; if (!countries.includes(c)) setCountries([...countries, c]); setNewCountry(''); }}>Add</button>
                            {config.complianceFramework === 'DOW_STANDARD' && <button className="btn btn-ghost btn-sm" onClick={() => setCountries(['COUNTRY_CN', 'COUNTRY_RU', 'COUNTRY_IR', 'COUNTRY_IQ', 'COUNTRY_SO', 'COUNTRY_KP'])}>Reset to DOW list</button>}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>← Back</button>
            {offCount > 0 && <button className="btn btn-ghost" onClick={() => setConfig({ ...config, disabledRules: {}, disabledSettings: {} })}>Turn everything back on</button>}
            <button className="btn btn-ghost" onClick={() => saveFramework(config, setError, (config.loadedFramework && config.loadedFramework.name) || (config.complianceFramework === 'DOW_STANDARD' ? 'DOW Standard' : 'ZIA framework'))} data-saveframework>💾 Save framework</button>
            <button className="btn btn-primary" onClick={handleGenerate} disabled={loading || !catalog} data-next>
              {loading ? <><span className="spinner"></span> Generating...</> : 'Generate & Review →'}
            </button>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Review / Plan
    // ========================
    function ReviewStep({ template, plan, setPlan, auth, setError, loading, setLoading, onApply, onBack }) {
      const [tab, setTab] = useState('policies');

      const runDryRun = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/plan/dryrun', { template });
          setPlan(result);
          setTab('diff');
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      if (!template) return <div className="alert alert-warning">No template generated. Go back to Customize step.</div>;

      const allPolicies = [
        ...(template.policies.urlFiltering || []).map(r => ({...r, category: 'URL Filtering'})),
        ...(template.policies.firewallFiltering || []).map(r => ({...r, category: 'Firewall'})),
        ...(template.policies.ipsControl || []).map(r => ({...r, category: 'IPS Control'})),
        ...(template.policies.sslInspection || []).map(r => ({...r, category: 'SSL Inspection', action: typeof r.action === 'string' ? r.action : (r.action && r.action.type)})),
        ...(template.policies.sandbox || []).map(r => ({...r, category: 'Sandbox', action: r.baRuleAction})),
        ...(template.policies.dnsSecurity || []).map(r => ({...r, category: 'DNS Security'})),
        ...(template.policies.fileTypeControl || []).map(r => ({...r, category: 'File Type Control', action: r.filteringAction})),
        ...(template.policies.cloudAppControl || []).map(r => ({...r, category: 'Cloud App Control', action: (r.actions||[]).join(', ')})),
        ...(template.policies.dlp || []).map(r => ({...r, category: 'Data Loss Prevention', action: r.action || 'ALLOW'})),
      ];
      const actionChanges = template.actionChanges || [];
      const weakenedChanges = actionChanges.filter(c => c.weakened);

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Review: {template.metadata.name}</h2>
              <p>
                Tier: <strong>{template.metadata.tier}</strong>
                {template.metadata.complianceFramework && <> · Framework: <strong>{template.metadata.complianceFramework.name}</strong></>}
                · Prefix: <strong>{template.metadata.prefix}</strong>
              </p>
            </div>

            {actionChanges.length > 0 && (
              <div className={`alert ${weakenedChanges.length ? 'alert-warning' : 'alert-info'}`}>
                <span>{weakenedChanges.length ? '⚠' : 'ℹ'} {actionChanges.length} rule{actionChanges.length === 1 ? '' : 's'} differ from the {template.metadata.tier} tier default
                {weakenedChanges.length > 0 && <> — {weakenedChanges.length} weaken protection ({weakenedChanges.slice(0, 3).map(c => `${c.name}: ${c.from}→${c.to}`).join(', ')}{weakenedChanges.length > 3 ? ', …' : ''})</>}.</span>
              </div>
            )}
            <div style={{display:'flex', gap:'8px', marginBottom:'1rem'}}>
              <button className={`btn btn-sm ${tab==='policies' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setTab('policies')}>Policy Rules ({allPolicies.length})</button>
              <button className={`btn btn-sm ${tab==='checklist' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setTab('checklist')}>Checklist</button>
              <button className={`btn btn-sm ${tab==='compliance' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => setTab('compliance')}>Compliance Evidence</button>
              <button className={`btn btn-sm ${tab==='diff' ? 'btn-primary' : 'btn-ghost'}`}
                onClick={() => { if (!plan) runDryRun(); else setTab('diff'); }}>
                {plan ? 'Diff View' : 'Run Dry Run'}
              </button>
            </div>

            {tab === 'policies' && (
              <div style={{overflowX:'auto'}}>
                <table className="diff-table">
                  <thead>
                    <tr>
                      <th>Order</th>
                      <th>Category</th>
                      <th>Rule Name</th>
                      <th>Action</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    {allPolicies.map((r, i) => (
                      <tr key={i}>
                        <td>{r.order}</td>
                        <td><span className="badge badge-category">{r.category}</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{r.name}</td>
                        <td>
                          <span className={`badge ${isBlockAction(r.action) ? 'badge-risk' : 'badge-create'}`}>
                            {r.action}
                          </span>
                          {r.actionChanged && (
                            <div style={{fontSize:'11px', marginTop:'4px', color: r.weakened ? 'var(--accent-amber)' : 'var(--text-muted)'}}>
                              {r.weakened ? '⚠ ' : ''}tier default: {r.defaultActions ? r.defaultActions.join(', ') : r.defaultAction}
                            </div>
                          )}
                        </td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>{r.description}</td>
                      </tr>
                    ))}
                    {template.policies.advancedThreatProtection && (
                      <tr data-atprow>
                        <td>—</td>
                        <td><span className="badge badge-category">ATP</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{template.policies.advancedThreatProtection.name}</td>
                        <td><span className="badge badge-update">SETTINGS</span></td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>
                          {Object.values(template.policies.advancedThreatProtection.settings || {}).filter(Boolean).length} protections blocked
                          {(template.policies.advancedThreatProtection.blockedCountries || []).length > 0 && <> · blocks {template.policies.advancedThreatProtection.blockedCountries.map(c => (COUNTRY_NAMES[c] || c.replace('COUNTRY_', ''))).join(', ')}</>}
                        </td>
                      </tr>
                    )}
                    {template.policies.malwareProtection && (
                      <tr>
                        <td>—</td>
                        <td><span className="badge badge-category">Malware</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{template.policies.malwareProtection.name}</td>
                        <td><span className="badge badge-update">CONFIG</span></td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>Malware & Advanced Threat Protection settings</td>
                      </tr>
                    )}
                    {template.policies.advancedSettings && (
                      <tr>
                        <td>—</td>
                        <td><span className="badge badge-category">Advanced</span></td>
                        <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{template.policies.advancedSettings.name}</td>
                        <td><span className="badge badge-update">CONFIG</span></td>
                        <td style={{fontSize:'12px', color:'var(--text-secondary)'}}>Advanced cloud settings configuration</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            )}

            {tab === 'checklist' && (
              <div>
                {template.implementationChecklist.map((item, i) => (
                  <div key={i} style={{
                    display:'flex', alignItems:'center', gap:'10px',
                    padding:'8px 12px', borderBottom:'1px solid var(--border)',
                    fontSize:'13px'
                  }}>
                    <span style={{
                      width:'20px', height:'20px', borderRadius:'4px',
                      border:'1px solid var(--border)', display:'flex',
                      alignItems:'center', justifyContent:'center', fontSize:'10px',
                      flexShrink:0
                    }}>
                      {item.manual ? '✋' : '○'}
                    </span>
                    <span className="badge badge-category" style={{fontSize:'10px', flexShrink:0}}>{item.category}</span>
                    <span>{item.task}</span>
                    {item.manual && <span style={{fontSize:'11px', color:'var(--accent-amber)'}}>MANUAL</span>}
                  </div>
                ))}
              </div>
            )}

            {tab === 'compliance' && (
              <div>
                {!template.metadata.complianceFramework ? (
                  <div className="alert alert-info">No compliance framework selected. Go back to select one for evidence mapping.</div>
                ) : (
                  <div>
                    <h3 style={{fontSize:'14px', marginBottom:'1rem'}}>
                      {template.metadata.complianceFramework.name} Compliance Evidence
                    </h3>
                    {allPolicies.filter(r => r.complianceMapping?.length > 0).map((r, i) => (
                      <div key={i} className="evidence-item">
                        <div style={{fontWeight:600, marginBottom:'4px'}}>{r.name}</div>
                        {r.complianceMapping.map((m, j) => (
                          <div key={j} style={{fontSize:'12px'}}>
                            <span className="fw">{m.framework}</span> →
                            <span className="ctrl"> {m.id}: {m.name}</span>
                            {m.description && <span style={{color:'var(--text-muted)'}}> — {m.description}</span>}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {tab === 'diff' && (
              <div>
                {loading ? (
                  <div style={{textAlign:'center', padding:'2rem'}}><div className="spinner" style={{margin:'0 auto'}}></div><p style={{marginTop:'8px', color:'var(--text-muted)'}}>Running dry run against your tenant...</p></div>
                ) : plan ? (
                  <div>
                    <div className="alert alert-info">
                      ℹ Plan Summary: <strong>{plan.summary.creates} creates</strong>, <strong>{plan.summary.updates} updates</strong>{plan.summary.existing > 0 && <>, <strong>{plan.summary.existing} already exist (left as is)</strong></>}
                      {plan.summary.actionOverrides > 0 && <>, <strong>{plan.summary.actionOverrides} Allow/Block overrides</strong></>}
                      {plan.summary.riskyActions > 0 && <>, <span style={{color:'var(--accent-red)'}}>{plan.summary.riskyActions} risky actions</span></>}
                    </div>
                    {plan.errors?.length > 0 && plan.errors.map((w,i) => (
                      <div key={'e'+i} className="alert alert-danger" data-planerror>✕ {typeof w === 'string' ? w : (w.error || JSON.stringify(w))}</div>
                    ))}
                    {plan.warnings?.length > 0 && plan.warnings.map((w,i) => (
                      <div key={i} className="alert alert-warning">⚠ {w}</div>
                    ))}
                    {plan.resolved && (plan.resolved.categories || plan.resolved.cbi || plan.resolved.ips) && (
                      <div className="ab-group" style={{padding:'12px 14px'}} data-resolved>
                        <div className="ab-group-title">Matched to this tenant</div>
                        {plan.resolved.categories && (
                          <div style={{fontSize:'13px', marginTop:'6px'}}>
                            URL categories ({plan.resolved.categories.source}): <strong>{plan.resolved.categories.block}</strong> Block · <strong>{plan.resolved.categories.allow}</strong> Allow · <strong>{plan.resolved.categories.isolate}</strong> Isolate
                            <details style={{fontSize:'12px'}}><summary style={{cursor:'pointer'}}>Isolated categories</summary>{plan.resolved.categories.isolateNames.join(', ')}</details>
                          </div>
                        )}
                        {plan.resolved.cbi && <div style={{fontSize:'13px', marginTop:'6px'}}>Isolation profile: <strong>{plan.resolved.cbi.name || 'none'}</strong>{plan.resolved.cbi.available && ` (${plan.resolved.cbi.available.length} in tenant)`}</div>}
                        {plan.resolved.ips && <div style={{fontSize:'13px', marginTop:'6px'}}>IPS threat category: <strong>{plan.resolved.ips.resolved ? `${plan.resolved.ips.resolved.name} (ID ${plan.resolved.ips.resolved.id})` : 'not found'}</strong></div>}
                      </div>
                    )}
                    {plan.actions.filter(a => a.atpChanges).map((a, i) => (
                      <div className="ab-group" key={'atp'+i} style={{padding:'12px 14px'}} data-atpplan>
                        <div className="ab-group-title">Advanced Threat Protection — {a.atpChanges.length} setting{a.atpChanges.length === 1 ? '' : 's'} change</div>
                        {a.atpChanges.map(c => <div key={c.field} style={{fontSize:'12px', fontFamily:'IBM Plex Mono'}}>{c.field}: {String(c.from)} → <span style={{color:'var(--accent-green)'}}>{String(c.to)}</span></div>)}
                        {a.countriesAdded.length > 0 && <div style={{fontSize:'12px', marginTop:'4px'}}>Countries to block: <strong>{a.countriesAdded.map(c => COUNTRY_NAMES[c] || c).join(', ')}</strong></div>}
                        {a.alreadyBlockedCountries.length > 0 && <div style={{fontSize:'12px', color:'var(--text-muted)'}}>Already blocked: {a.alreadyBlockedCountries.map(c => COUNTRY_NAMES[c] || c).join(', ')}</div>}
                      </div>
                    ))}
                    <table className="diff-table">
                      <thead>
                        <tr>
                          <th>Action</th>
                          <th>Category</th>
                          <th>Rule Name</th>
                          <th>Current</th>
                          <th>Proposed</th>
                        </tr>
                      </thead>
                      <tbody>
                        {plan.actions.map((a, i) => (
                          <tr key={i}>
                            <td>
                              <span className={`badge ${a.type==='CREATE' ? 'badge-create' : a.type==='EXISTS' ? 'badge-category' : 'badge-update'}`} title={a.type==='EXISTS' ? 'A rule with this name already exists; it is left unchanged' : ''}>{a.type === 'EXISTS' ? 'EXISTS — LEFT AS IS' : a.type}</span>
                              {a.isRisky && <span className="badge badge-risk" style={{marginLeft:'4px'}}>RISK</span>}
                              {a.weakened && <span className="badge badge-risk" style={{marginLeft:'4px'}}>WEAKENED</span>}
                              {a.actionChanged && !a.weakened && <span className="badge badge-update" style={{marginLeft:'4px'}}>OVERRIDE</span>}
                            </td>
                            <td><span className="badge badge-category">{a.category}</span></td>
                            <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{a.name}</td>
                            <td style={{fontSize:'12px', color:'var(--text-muted)'}}>
                              {a.current ? JSON.stringify(a.current) : '—'}
                            </td>
                            <td style={{fontSize:'12px', color:'var(--accent-green)'}}>
                              {JSON.stringify(a.proposed)}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ) : (
                  <div>
                    <button className="btn btn-primary" onClick={runDryRun} disabled={loading}>
                      Run Dry Run Against Tenant
                    </button>
                    <p className="form-hint" style={{marginTop:'8px'}}>This will read your current configuration and show what would change.</p>
                  </div>
                )}
              </div>
            )}

            <div className="btn-group">
              <button className="btn btn-ghost" onClick={onBack}>← Back</button>
              {!auth.connected ? (
                <div className="alert alert-warning" style={{margin:0}}>Connect to ZIA first to apply changes</div>
              ) : (
                <button className="btn btn-success" onClick={onApply}>
                  Proceed to Apply →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Apply
    // ========================
    function ApplyStep({ template, plan, applyResult, setApplyResult, setError, loading, setLoading, onNext }) {
      const [confirmed, setConfirmed] = useState(false);

      const handleApply = async () => {
        setLoading(true); setError(null);
        try {
          const result = await api.call('POST', '/apply', {
            template,
            snapshotId: plan?.snapshotId
          });
          setApplyResult(result);
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      const handleRollback = async () => {
        if (!plan?.snapshotId) return;
        setLoading(true);
        try {
          const result = await api.call('POST', '/rollback', { snapshotId: plan.snapshotId });
          alert(result.message);
        } catch (e) {
          setError(e.message);
        }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Apply Configuration</h2>
              <p>This will create policy rules in your ZIA tenant and activate the changes.</p>
            </div>

            {!applyResult ? (
              <div>
                <div className="alert alert-warning">
                  ⚠ <strong>Caution:</strong> This will make real changes to your ZIA tenant. A snapshot has been
                  taken for best-effort rollback. New rules are added after your existing rules (just above the default rule), so an existing rule that matches first still wins — check the order in the portal after apply.
                </div>

                <div className="toggle-item" style={{marginBottom:'1rem'}}>
                  <label onClick={() => setConfirmed(!confirmed)} style={{cursor:'pointer'}}>
                    I understand this will modify my ZIA tenant configuration and have reviewed the plan.
                  </label>
                  <div className={`toggle-switch ${confirmed ? 'active' : ''}`}
                    onClick={() => setConfirmed(!confirmed)}>
                    <div className="toggle-knob"></div>
                  </div>
                </div>

                <div className="btn-group">
                  <button className="btn btn-success" onClick={handleApply} disabled={!confirmed || loading}>
                    {loading ? <><span className="spinner"></span> Applying...</> : '🚀 Apply Changes'}
                  </button>
                </div>
              </div>
            ) : (
              <div>
                {applyResult.activated ? (
                  <div className="alert alert-success">
                    ✓ Changes applied and activated successfully!
                    Applied {applyResult.summary.applied} rules with {applyResult.summary.errors} errors.
                  </div>
                ) : (
                  <div className="alert alert-danger">
                    Changes were applied but activation may have failed. Check errors below.
                  </div>
                )}

                {applyResult.applied?.length > 0 && (
                  <div style={{marginBottom:'1rem'}}>
                    <h3 style={{fontSize:'14px', marginBottom:'8px', color:'var(--accent-green)'}}>Applied ({applyResult.applied.length})</h3>
                    {applyResult.applied.map((a, i) => (
                      <div key={i} style={{padding:'6px 12px', borderBottom:'1px solid var(--border)', fontSize:'13px'}}>
                        <span className={`badge ${a.type==='CREATE' ? 'badge-create' : 'badge-update'}`}>{a.type}</span>
                        {' '}<span className="badge badge-category">{a.category}</span>
                        {' '}{a.name}
                        {a.id && <span style={{color:'var(--text-muted)', marginLeft:'8px'}}>ID: {a.id}</span>}
                      </div>
                    ))}
                  </div>
                )}

                {applyResult.errors?.length > 0 && (
                  <div style={{marginBottom:'1rem'}}>
                    <h3 style={{fontSize:'14px', marginBottom:'8px', color:'var(--accent-red)'}}>Errors ({applyResult.errors.length})</h3>
                    {applyResult.errors.map((e, i) => (
                      <div key={i} className="alert alert-danger" style={{fontSize:'13px'}}>
                        {e.category} / {e.name}: {e.error}
                      </div>
                    ))}
                  </div>
                )}

                <div className="btn-group">
                  <button className="btn btn-danger" onClick={handleRollback} disabled={loading}>
                    ↩ Attempt Rollback
                  </button>
                  <button className="btn btn-primary" onClick={onNext}>
                    View Audit Log →
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================
    // Step: Audit Log
    // ========================
    function AuditStep({ auditLogs, setAuditLogs, setError }) {
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        if (!loaded) {
          api.call('GET', '/audit/logs').then(setAuditLogs).catch(e => setError(e.message));
          setLoaded(true);
        }
      }, [loaded]);

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Audit Log</h2>
              <p>Complete record of all actions taken during this session.</p>
            </div>

            <div className="btn-group" style={{marginTop:0, marginBottom:'1rem'}}>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                window.open('/api/audit/export/csv', '_blank');
              }}>📥 Export CSV</button>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                window.open('/api/audit/export/json', '_blank');
              }}>📥 Export JSON</button>
              <button className="btn btn-ghost btn-sm" onClick={() => {
                api.call('GET', '/audit/logs').then(setAuditLogs).catch(e => setError(e.message));
              }}>🔄 Refresh</button>
            </div>

            <div style={{maxHeight:'500px', overflowY:'auto', border:'1px solid var(--border)', borderRadius:'var(--radius)'}}>
              <div className="log-entry" style={{background:'var(--bg-secondary)', position:'sticky', top:0}}>
                <span style={{fontWeight:600}}>Timestamp</span>
                <span style={{fontWeight:600}}>Action</span>
                <span style={{fontWeight:600}}>Status</span>
                <span style={{fontWeight:600}}>Details</span>
              </div>
              {auditLogs.length === 0 ? (
                <div style={{padding:'2rem', textAlign:'center', color:'var(--text-muted)'}}>No log entries yet</div>
              ) : (
                auditLogs.map((entry, i) => (
                  <div key={i} className="log-entry">
                    <span className="ts">{new Date(entry.timestamp).toLocaleString()}</span>
                    <span className="action">{entry.action}</span>
                    <span className={entry.status === 'success' ? 'status-ok' : 'status-err'}>
                      {entry.status}

                    <span style={{color:'var(--text-secondary)', wordBreak:'break-all'}}>

    // ========================
    // Step: Policy Catalog (no auth required)
    // ========================
    function CatalogStep() {
      const [catalog, setCatalog] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [openTiers, setOpenTiers] = useState({});
      const [openFws, setOpenFws] = useState({});
      const [openPolicies, setOpenPolicies] = useState({});

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        fetch('/api/catalog').then(r => r.json()).then(data => {
          if (!cancelled) { setCatalog(data); setLoading(false); }
        }).catch(e => {
          if (!cancelled) { setError(e.message); setLoading(false); }
        });
        return () => { cancelled = true; };
      }, []);

      const toggle = (map, setMap, key) => setMap(prev => ({ ...prev, [key]: !prev[key] }));

      const tierMeta = {
        STRICT: { icon: '🔒', label: 'Strict', color: 'var(--accent-red)' },
        BALANCED: { icon: '⚖️', label: 'Balanced', color: 'var(--accent-blue)' },
        PERMISSIVE: { icon: '🔓', label: 'Permissive', color: 'var(--accent-green)' },
        DOW_STANDARD: { icon: '🛡️', label: 'DOW Standard', color: 'var(--accent-cyan)' }
      };

      const policyLabels = {
        urlFiltering: '🌐 URL Filtering',
        firewallFiltering: '🔥 Cloud Firewall',
        ipsControl: '🚨 IPS Control',
        advancedThreatProtection: '🧯 Advanced Threat Protection',
        sslInspection: '🔒 SSL/TLS Inspection',
        sandbox: '📦 Cloud Sandbox',
        dnsSecurity: '🛡️ DNS Security',
        fileTypeControl: '📄 File Type Control',
        cloudAppControl: '☁️ Cloud App Control',
        dlp: '🔍 Data Loss Prevention',
        malwareProtection: '🦠 Malware Protection',
        advancedSettings: '⚙️ Advanced Settings'
      };

      function getActionClass(action) {
        if (!action) return '';
        const a = String(action).toUpperCase();
        if (a.includes('BLOCK')) return 'BLOCK';
        if (a === 'ALLOW') return 'ALLOW';
        if (a === 'CAUTION') return 'CAUTION';
        if (a.includes('DECRYPT') && !a.includes('NOT')) return 'DECRYPT';
        if (a.includes('DO_NOT_DECRYPT')) return 'DO_NOT_DECRYPT';
        if (a.includes('QUARANTINE')) return 'QUARANTINE';
        if (a.includes('INSPECT')) return 'INSPECT';
        return '';
      }

      function renderRule(rule, idx) {
        const actionClass = getActionClass(rule.action);
        return (
          <div className="catalog-rule" key={idx}>
            <div>
              <span className="catalog-rule-name">{rule.name}</span>
              <span className={`catalog-rule-action ${actionClass}`}>{rule.action}</span>
              {rule.severity && <span className="catalog-rule-action" style={{background:'var(--bg-secondary)',color:'var(--text-muted)',marginLeft:'4px'}}>{rule.severity.replace('RULE_SEVERITY_','')}</span>}
            </div>
            {rule.description && <div className="catalog-rule-detail">{rule.description}</div>}
            {rule.urlCategories && rule.urlCategories.length > 0 && (
              <div className="catalog-rule-cats">Categories: {rule.urlCategories.join(', ')}</div>
            )}
            {rule.nwApplications && rule.nwApplications.length > 0 && (
              <div className="catalog-rule-cats">Apps: {rule.nwApplications.join(', ')}</div>
            )}
            {rule.dictionaryNames && rule.dictionaryNames.length > 0 && (
              <div className="catalog-rule-cats">Dictionaries: {rule.dictionaryNames.join(', ')}</div>
            )}
            {rule.preferredEngines && rule.preferredEngines.length > 0 && (
              <div className="catalog-rule-cats">Preferred Engines: {rule.preferredEngines.join(', ')}</div>
            )}
            {rule.fileTypes && rule.fileTypes.length > 0 && (
              <div className="catalog-rule-cats">File Types: {Array.isArray(rule.fileTypes) ? rule.fileTypes.join(', ') : rule.fileTypes}</div>
            )}
            {rule.baPolicyCategories && rule.baPolicyCategories.length > 0 && (
              <div className="catalog-rule-cats">Sandbox categories: {rule.baPolicyCategories.join(', ')}</div>
            )}
            {rule.threatCategory && <div className="catalog-rule-cats">Threat category: {rule.threatCategory}</div>}
            {rule.isolateAllOthers && <div className="catalog-rule-cats" style={{color:'var(--accent-cyan)'}}>Isolate list is rebuilt from the tenant's categories at dry run</div>}
            {rule.firstTimeOperation && (
              <div className="catalog-rule-cats">First-time: {rule.firstTimeOperation}</div>
            )}
            {rule.withoutContentInspection && (
              <div className="catalog-rule-cats" style={{color:'var(--accent-amber)'}}>Without Content Inspection</div>
            )}
            {rule.complianceMapping && rule.complianceMapping.length > 0 && (
              <div style={{marginTop:'4px'}}>
                {rule.complianceMapping.map((c, ci) => (
                  <span key={ci} className="catalog-compliance-tag">{c.framework} {c.id}: {c.name}</span>
                ))}
              </div>
            )}
          </div>
        );
      }

      function renderPolicies(policies, tierKey, fwKey) {
        return Object.entries(policies).map(([policyType, rules]) => {
          const pKey = `${tierKey}-${fwKey}-${policyType}`;
          const isOpen = openPolicies[pKey];
          const count = Array.isArray(rules) ? rules.length : 1;
          const label = policyLabels[policyType] || policyType;
          return (
            <div className="catalog-policy-group" key={policyType}>
              <div className="catalog-policy-header" onClick={() => toggle(openPolicies, setOpenPolicies, pKey)}>
                <span className="arrow" style={{fontSize:'10px',transition:'transform 0.2s',transform:isOpen?'rotate(90deg)':'none'}}>▶</span>
                {label}
                <span className="catalog-count">{count}</span>
              </div>
              {isOpen && Array.isArray(rules) && rules.map((r, i) => renderRule(r, i))}
              {isOpen && !Array.isArray(rules) && rules.settings && (
                <div className="catalog-rule">
                  <div className="catalog-rule-name">{rules.name}</div>
                  {rules.description && <div className="catalog-rule-detail">{rules.description}</div>}
                  <div className="catalog-rule-cats" style={{whiteSpace:'pre-wrap'}}>{JSON.stringify(rules.settings, null, 2)}</div>
                  {rules.blockedCountries && rules.blockedCountries.length > 0 && <div className="catalog-rule-cats">Blocked countries: {rules.blockedCountries.map(c => COUNTRY_NAMES[c] || c).join(', ')}</div>}
                  {rules.complianceMapping && rules.complianceMapping.length > 0 && (
                    <div style={{marginTop:'4px'}}>
                      {rules.complianceMapping.map((c, ci) => (
                        <span key={ci} className="catalog-compliance-tag">{c.framework} {c.id}: {c.name}</span>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        });
      }

      if (loading) return <div className="catalog-loading">Loading policy catalog...</div>;
      if (error) return <div className="alert alert-danger">Failed to load catalog: {error}</div>;
      if (!catalog) return null;
      const d = catalog.dow;
      const chipList = (items, cls) => (
        <div style={{display:'flex', flexWrap:'wrap', gap:'4px', marginTop:'6px'}}>
          {items.map((x, i) => <span key={i} className={`badge ${cls}`} title={x.title || ''}>{x.label}</span>)}
        </div>
      );

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>📖 Policy Catalog</h2>
              <p>Everything each framework creates — the DOW Standard, and NIST 800-53 / NIST 800-171 on each baseline. No sign-in needed.</p>
            </div>

            <div className="catalog-tier" data-dowsheet>
              <div className="catalog-tier-header" onClick={() => toggle(openTiers, setOpenTiers, 'DOWSHEET')}>
                <span className="arrow" style={{transform:openTiers.DOWSHEET?'rotate(90deg)':'none'}}>▶</span>
                <span>🛡️</span><span style={{color:'var(--accent-cyan)'}}>DOW Standard — category sheet mapping</span>
                <span className="catalog-count">{d.block.length} block · {d.allow.length} allow · {d.isolate.length}+ isolate</span>
              </div>
              {openTiers.DOWSHEET && (
                <div style={{padding:'0.5rem 1rem 1rem'}}>
                  <div className="catalog-rule">
                    <div className="catalog-rule-name">Block</div>
                    {chipList(d.block.map(r => ({ label: `${r.sheet}${r.names.length ? '' : ' (no ZIA match)'}`, title: r.note ? `${r.names.join(' / ')} — ${r.note}` : r.names.join(' / ') })), 'badge-risk')}
                    {d.block.filter(r => r.note).map((r, i) => <div key={i} className="catalog-rule-detail">• {r.sheet}: {r.note}</div>)}
                  </div>
                  <div className="catalog-rule">
                    <div className="catalog-rule-name">Allow</div>
                    {chipList(d.allow.map(r => ({ label: r.sheet, title: r.names.join(' / ') })), 'badge-create')}
                  </div>
                  <div className="catalog-rule">
                    <div className="catalog-rule-name">Isolate — every other category (Cloud Browser Isolation)</div>
                    <div className="catalog-rule-detail">From Zscaler's published list; at dry run it is rebuilt from the tenant so newer categories (e.g. the AI categories) are isolated too. ATP-only and Office 365 SSL categories are excluded.</div>
                    {chipList(d.isolate.map(c => ({ label: c.name, title: c.id })), 'badge-category')}
                  </div>
                  <div className="catalog-rule">
                    <div className="catalog-rule-name">Advanced Threat Protection</div>
                    {chipList(d.atp.map(a => ({ label: `${a.sheet}: ${a.label}`, title: a.key })), 'badge-risk')}
                    <div className="catalog-rule-cats">Blocked countries: {d.countries.map(c => c.name).join(', ')}</div>
                  </div>
                  <div className="catalog-rule"><div className="catalog-rule-name">IPS</div><div className="catalog-rule-cats">Command and Control — Block (drop)</div></div>
                  <div className="catalog-rule"><div className="catalog-rule-name">Sandbox</div><div className="catalog-rule-cats">Malware; Ransomware — Block (BOTMAL_BLOCK, RANSOMWARE_BLOCK)</div></div>
                  <div className="catalog-rule"><div className="catalog-rule-name">File Type</div><div className="catalog-rule-cats">Flash — Block uploads and downloads (FTCATEGORY_FLASH)</div></div>
                  <div className="catalog-rule"><div className="catalog-rule-name">SSL Inspection</div><div className="catalog-rule-cats">Do not inspect: {(d.ssl && d.ssl[0] ? d.ssl[0].categories : ['Health', 'Finance']).join(', ')} · then Inspect all other traffic (TLS 1.2 minimum), signed with the certificate you choose</div></div>
                </div>
              )}
            </div>

            {catalog.views.map(v => {
              const meta = tierMeta[v.tier || 'DOW_STANDARD'] || { icon: '📋', color: 'var(--text-primary)' };
              const isOpen = openFws[v.id];
              const total = Object.values(v.ruleCounts || {}).reduce((s2, c) => s2 + c, 0);
              return (
                <div className="catalog-tier" key={v.id} data-catalogview={v.id}>
                  <div className="catalog-tier-header" onClick={() => toggle(openFws, setOpenFws, v.id)}>
                    <span className="arrow" style={{transform:isOpen?'rotate(90deg)':'none'}}>▶</span>
                    <span>{meta.icon}</span>
                    <span style={{color: meta.color}}>{v.label}</span>
                    <span className="catalog-count">{total} rules / settings</span>
                  </div>
                  {isOpen && (
                    <div>
                      <div className="catalog-summary" style={{margin:'0.5rem 0 0.25rem 1rem'}}>
                        {Object.entries(v.ruleCounts || {}).map(([pt, c]) => (
                          <span key={pt} className="catalog-summary-chip">{policyLabels[pt]?.split(' ').slice(1).join(' ') || pt}: {c}</span>
                        ))}
                      </div>
                      {renderPolicies(v.policies, v.id, 'v')}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ========================
    // Step: Bulk Delete
    // ========================
    function BulkDeleteStep({ setError, loading, setLoading }) {
      const [allRules, setAllRules] = useState(null);
      const [selected, setSelected] = useState(new Set());
      const [filterText, setFilterText] = useState('');
      const [deleteResult, setDeleteResult] = useState(null);
      const [fetchLoading, setFetchLoading] = useState(false);
      const [confirmOpen, setConfirmOpen] = useState(false);
      const mountedRef = useRef(true);

      useEffect(() => {
        mountedRef.current = true;
        return () => { mountedRef.current = false; };
      }, []);

      const CATEGORY_MAP = {
        urlFiltering: { label: 'URL Filtering', category: 'url-filtering' },
        firewall: { label: 'Cloud Firewall', category: 'firewall' },
        ssl: { label: 'SSL Inspection', category: 'ssl' },
        sandbox: { label: 'Sandbox', category: 'sandbox' },
        dns: { label: 'DNS Security', category: 'dns' },
        fileType: { label: 'File Type Control', category: 'file-type' },
        dlp: { label: 'DLP Rules', category: 'dlp' },
        dlpEngines: { label: 'DLP Engines (custom)', category: 'dlp-engine' },
        dlpDictionaries: { label: 'DLP Dictionaries (custom)', category: 'dlp-dictionary' }
      };

      const fetchRules = async () => {
        setFetchLoading(true); setDeleteResult(null);
        setAllRules(null);
        setSelected(new Set());
        console.log('[BulkDelete] Starting fetch...');
        try {
          const data = await api.call('GET', '/state/all-rules');
          if (!mountedRef.current) { console.log('[BulkDelete] Component unmounted during fetch, discarding'); return; }

          console.log('[BulkDelete] Raw API response keys:', Object.keys(data || {}));
          // Log each category's data type and count
          Object.entries(data || {}).forEach(([k, v]) => {
            console.log(`[BulkDelete]   ${k}: type=${typeof v}, isArray=${Array.isArray(v)}, length=${Array.isArray(v) ? v.length : 'N/A'}`);
            // Log first rule to check for object-type actions
            if (Array.isArray(v) && v.length > 0) {
              const sample = v[0];
              console.log(`[BulkDelete]   ${k}[0]: id=${sample.id}, name=${sample.name}, action type=${typeof sample.action}, action=${typeof sample.action === 'object' ? JSON.stringify(sample.action) : sample.action}`);
            }
          });

          const safe = {
            urlFiltering: Array.isArray(data?.urlFiltering) ? data.urlFiltering : [],
            firewall: Array.isArray(data?.firewall) ? data.firewall : [],
            ssl: Array.isArray(data?.ssl) ? data.ssl : [],
            sandbox: Array.isArray(data?.sandbox) ? data.sandbox : [],
            dns: Array.isArray(data?.dns) ? data.dns : [],
            fileType: Array.isArray(data?.fileType) ? data.fileType : [],
            dlp: Array.isArray(data?.dlp) ? data.dlp : [],
            dlpEngines: Array.isArray(data?.dlpEngines) ? data.dlpEngines : [],
            dlpDictionaries: Array.isArray(data?.dlpDictionaries) ? data.dlpDictionaries : []
          };

          // Count total rules for debug
          const total = Object.values(safe).reduce((sum, arr) => sum + arr.length, 0);
          console.log(`[BulkDelete] Normalized: ${total} total rules across ${Object.keys(safe).length} categories`);

          setAllRules(safe);
          console.log('[BulkDelete] State updated successfully');
        } catch (e) {
          console.error('[BulkDelete] Fetch error:', e);
          if (mountedRef.current) setError(e.message);
        }
        if (mountedRef.current) setFetchLoading(false);
      };

      // No auto-fetch — user clicks Load Rules (takes ~15s due to API rate limiting)

      // Client-side filter — filters the display, not the fetch
      const matchesFilter = (name) => {
        if (!filterText) return true;
        return (name || '').toLowerCase().includes(filterText.toLowerCase());
      };

      const toggleRule = (key) => {
        const next = new Set(selected);
        if (next.has(key)) next.delete(key); else next.add(key);
        setSelected(next);
      };

      const selectAllVisible = () => {
        const all = new Set(selected);
        if (!allRules) return;
        Object.entries(CATEGORY_MAP).forEach(([field, meta]) => {
          const rules = allRules[field];
          if (!Array.isArray(rules)) return;
          rules.forEach(r => {
            if (!r.defaultRule && r.id != null && matchesFilter(r.name))
              all.add(`${meta.category}::${r.id}::${r.name || 'unnamed'}`);
          });
        });
        setSelected(all);
      };

      const handleBulkDelete = async () => {
        setLoading(true); setError(null); setConfirmOpen(false);
        const rules = [];
        selected.forEach(key => {
          const parts = key.split('::');
          if (parts[0] === 'cloud-app') {
            rules.push({ category: 'cloud-app', id: parseInt(parts[1]), name: parts[2], ruleType: parts[3] });
          } else {
            rules.push({ category: parts[0], id: parseInt(parts[1]), name: parts[2] });
          }
        });
        try {
          const result = await api.call('POST', '/bulk-delete', { rules });
          if (!mountedRef.current) return;
          setDeleteResult(result);
          setSelected(new Set());
          fetchRules(); // Refresh
        } catch (e) { if (mountedRef.current) setError(e.message); }
        if (mountedRef.current) setLoading(false);
      };

      // Count total non-default rules
      const countRules = (rules) => {
        if (!Array.isArray(rules)) return { total: 0, filtered: 0 };
        const nonDefault = rules.filter(r => !r.defaultRule);
        const filtered = nonDefault.filter(r => matchesFilter(r.name));
        return { total: nonDefault.length, filtered: filtered.length };
      };

      const renderRuleTable = (rules, catKey, catMeta) => {
        if (!Array.isArray(rules)) return null;
        const visible = rules.filter(r => !r.defaultRule && matchesFilter(r.name));
        const defaults = rules.filter(r => r.defaultRule);
        if (visible.length === 0 && defaults.length === 0) return null;
        return (
          <div key={catKey} style={{marginBottom:'1rem'}}>
            <div style={{fontWeight:600, fontSize:'13px', color:'var(--accent-cyan)', marginBottom:'6px'}}>
              {catMeta.label} ({visible.length} deletable{defaults.length > 0 ? `, ${defaults.length} default` : ''})
            </div>
            {visible.map(r => {
              const key = `${catMeta.category}::${r.id}::${r.name}`;
              return (
                <div key={key} style={{
                  display:'flex', alignItems:'center', gap:'8px', padding:'6px 8px',
                  background: selected.has(key) ? 'var(--accent-red-dim)' : 'var(--bg-input)',
                  borderRadius:'4px', marginBottom:'2px', fontSize:'12px'
                }}>
                  <input type="checkbox" checked={selected.has(key)}
                    onChange={() => toggleRule(key)} />
                  <span style={{flex:1, fontFamily:'IBM Plex Mono'}}>{r.name}</span>
                  <span style={{color:'var(--text-muted)', fontSize:'11px'}}>ID:{r.id} · {typeof r.action === 'string' ? r.action : (r.action ? JSON.stringify(r.action) : '—')}</span>
                </div>
              );
            })}
            {defaults.length > 0 && (
              <div style={{fontSize:'11px', color:'var(--text-muted)', padding:'4px 8px', fontStyle:'italic'}}>
                + {defaults.length} default/predefined rule(s) (cannot be deleted)
              </div>
            )}
          </div>
        );
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>🗑️ Bulk Rule Manager</h2>
              <p>View and delete rules across ZIA policy categories. Default and predefined rules are excluded automatically. Cloud App Control rules must be managed in the ZIA admin portal.</p>
            </div>

            {/* Initial state — no rules loaded yet */}
            {!allRules && !fetchLoading && (
              <div style={{textAlign:'center', padding:'2rem'}}>
                <p style={{color:'var(--text-secondary)', marginBottom:'1rem'}}>
                  Click below to load rules from your ZIA tenant across URL Filtering, Firewall, SSL Inspection,
                  Sandbox, DNS Security, and File Type Control. Takes approximately 7-10 seconds due to API rate limiting.
                </p>
                <button className="btn btn-primary" onClick={fetchRules}>
                  📥 Load All Rules
                </button>
              </div>
            )}

            {/* Loading state */}
            {fetchLoading && (
              <div style={{padding:'2rem', textAlign:'center'}}>
                <span className="spinner"></span>
                <div style={{marginTop:'8px', color:'var(--text-secondary)'}}>
                  Loading rules from 6 policy categories...<br/>
                  <span style={{fontSize:'12px', color:'var(--text-muted)'}}>Takes ~7-10 seconds (API rate limiting)</span>
                </div>
              </div>
            )}

            {allRules && (
              <div>
                <div style={{display:'flex', gap:'8px', alignItems:'center', marginBottom:'1rem'}}>
                  <div className="form-group" style={{flex:1, marginBottom:0}}>
                    <input type="text" value={filterText}
                      onChange={e => setFilterText(e.target.value)}
                      placeholder="Filter rules by name (e.g. ZTH, Sandbox, Block...)" />
                  </div>
                  <button className="btn btn-ghost btn-sm" onClick={fetchRules}>🔄 Refresh</button>
                </div>

                <div style={{display:'flex', gap:'8px', marginBottom:'1rem'}}>
                  <button className="btn btn-ghost btn-sm" onClick={selectAllVisible}>
                    Select All {filterText ? 'Matching' : ''}
                  </button>
                  <button className="btn btn-ghost btn-sm" onClick={() => setSelected(new Set())}>Deselect All</button>
                  <div style={{flex:1}}></div>
                  <span style={{fontSize:'13px', color:'var(--text-secondary)', alignSelf:'center'}}>
                    {selected.size} rule(s) selected
                  </span>
                </div>

                <div style={{maxHeight:'500px', overflowY:'auto', border:'1px solid var(--border)', borderRadius:'var(--radius)', padding:'8px'}}>
                  {Object.entries(CATEGORY_MAP).map(([field, meta]) =>
                    renderRuleTable(allRules[field], field, meta)
                  )}
                </div>

                {selected.size > 0 && !confirmOpen && (
                  <div style={{marginTop:'1rem'}}>
                    <button className="btn" onClick={() => setConfirmOpen(true)}
                      style={{background:'var(--accent-red)', color:'white'}}>
                      🗑️ Delete {selected.size} Rule(s)
                    </button>
                  </div>
                )}

                {confirmOpen && (
                  <div className="alert alert-danger" style={{marginTop:'1rem'}}>
                    <strong>⚠ Confirm Bulk Delete</strong>
                    <p style={{margin:'8px 0'}}>You are about to permanently delete <strong>{selected.size}</strong> rule(s) from your ZIA tenant and activate changes. This cannot be undone.</p>
                    <div style={{display:'flex', gap:'8px'}}>
                      <button className="btn btn-sm" onClick={handleBulkDelete} disabled={loading}
                        style={{background:'var(--accent-red)', color:'white'}}>
                        {loading ? <><span className="spinner"></span> Deleting...</> : '⚠ Yes, Delete All'}
                      </button>
                      <button className="btn btn-ghost btn-sm" onClick={() => setConfirmOpen(false)}>Cancel</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {deleteResult && (
              <div style={{marginTop:'1rem'}}>
                <div className="alert" style={{background:'var(--bg-input)', borderColor:'var(--border)'}}>
                  <strong>Delete Results:</strong>
                  <div style={{fontSize:'13px', marginTop:'8px'}}>
                    ✅ Deleted: {deleteResult.summary?.deleted || 0} ·
                    ❌ Errors: {deleteResult.summary?.errors || 0} ·
                    ⏭ Skipped: {deleteResult.summary?.skipped || 0} ·
                    {deleteResult.summary?.activated ? '✅ Activated' : '⚠ Not Activated'}
                  </div>
                  {deleteResult.errors?.length > 0 && (
                    <div style={{marginTop:'8px'}}>
                      {deleteResult.errors.map((e, i) => (
                        <div key={i} style={{fontSize:'11px', color:'var(--accent-red)'}}>{e.name}: {e.error}</div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================
    // Render
    // ========================
    ReactDOM.render(
      React.createElement(ErrorBoundary, null, React.createElement(App)),
      document.getElementById('app')
    );
  </script>
</body>
</html>
