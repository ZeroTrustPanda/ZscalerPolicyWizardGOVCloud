<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zscaler Policy Wizard GovCloud Edition</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 22'%3E%3Cpath d='M10 1 2 4v6c0 5.2 3.4 9.4 8 11 4.6-1.6 8-5.8 8-11V4l-8-3Z' fill='%2306b6d4'/%3E%3Cpath d='m6.5 11 2.4 2.4 4.6-4.8' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --bg-card: #1a2236;
      --bg-card-hover: #1f2943;
      --bg-input: #0f1629;
      --border: #2a3654;
      --border-focus: #3b82f6;
      --text-primary: #e8ecf4;
      --text-secondary: #8896b3;
      --text-muted: #5c6b8a;
      --accent-blue: #3b82f6;
      --accent-blue-dim: #1e40af;
      --accent-green: #10b981;
      --accent-green-dim: #065f46;
      --accent-amber: #f59e0b;
      --accent-amber-dim: #78350f;
      --accent-red: #ef4444;
      --accent-red-dim: #7f1d1d;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --radius: 8px;
      --radius-lg: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Layout */
    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: white;
    }
    .header-brand h1 {
      font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-brand .tag {
      font-size: 10px; padding: 2px 8px; border-radius: 4px;
      background: var(--accent-blue-dim); color: var(--accent-blue);
      font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .auth-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
    }
    .auth-badge.connected { background: var(--accent-green-dim); color: var(--accent-green); }
    .auth-badge.disconnected { background: var(--accent-red-dim); color: var(--accent-red); }
    .auth-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
    .auth-badge.connected .dot { background: var(--accent-green); }
    .auth-badge.disconnected .dot { background: var(--accent-red); }

    .main { flex: 1; display: flex; }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      flex-shrink: 0;
    }
    .sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
    .sidebar-section-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); padding: 0 0.5rem;
      margin-bottom: 8px;
    }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 14px; color: var(--text-secondary);
      transition: all 0.15s;
      position: relative;
    }
    .sidebar-item:hover { background: var(--bg-card); color: var(--text-primary); }
    .sidebar-item.active {
      background: var(--accent-blue-dim);
      color: var(--accent-blue);
      font-weight: 500;
    }
    .sidebar-item .step-num {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      background: var(--bg-input); border: 1px solid var(--border);
    }
    .sidebar-item.active .step-num {
      background: var(--accent-blue); border-color: var(--accent-blue); color: white;
    }
    .sidebar-item.completed .step-num {
      background: var(--accent-green); border-color: var(--accent-green); color: white;
    }

    .content { flex: 1; padding: 2rem 3rem; max-width: 960px; }
    .content-wide { max-width: 1200px; }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card-header { margin-bottom: 1rem; }
    .card-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .card-header h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .card-header p { font-size: 14px; color: var(--text-secondary); }

    /* Form Elements */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text-secondary); margin-bottom: 6px;
    }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 80px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-success { background: var(--accent-green); color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-warning { background: var(--accent-amber); color: #1a1a1a; }
    .btn-danger { background: var(--accent-red); color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-ghost {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text-primary); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .btn-group { display: flex; gap: 8px; margin-top: 1.5rem; }

    /* Tier Cards */
    .tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin: 1rem 0; }
    .tier-card {
      background: var(--bg-input);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .tier-card:hover { border-color: var(--text-muted); }
    .tier-card.selected { border-color: var(--accent-blue); background: var(--accent-blue-dim); }
    .tier-card .tier-icon { font-size: 28px; margin-bottom: 8px; }
    .tier-card .tier-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .tier-card .tier-desc { font-size: 12px; color: var(--text-secondary); }

    /* Compliance Grid */
    .compliance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 1rem 0; }
    .compliance-chip {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      text-align: center;
    }
    .compliance-chip:hover { border-color: var(--text-muted); }
    .compliance-chip.selected { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Toggle */
    .toggle-group { display: flex; flex-direction: column; gap: 8px; }
    .toggle-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .toggle-item label { font-size: 14px; cursor: pointer; }
    .toggle-switch {
      position: relative; width: 44px; height: 24px;
      background: var(--bg-secondary); border-radius: 12px;
      cursor: pointer; transition: background 0.2s;
      border: 1px solid var(--border);
    }
    .toggle-switch.active { background: var(--accent-blue); border-color: var(--accent-blue); }
    .toggle-switch .toggle-knob {
      position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; transition: transform 0.2s;
    }
    .toggle-switch.active .toggle-knob { transform: translateX(20px); }

    /* Allow / Block step (v1.6.0) */
    .ab-group { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; background: var(--bg-input); }
    .ab-group-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; flex-wrap: wrap; }
    .ab-group-title { font-size: 14px; font-weight: 600; }
    .ab-group-sub { font-size: 12px; color: var(--text-muted); }
    .ab-rows { border-top: 1px solid var(--border); }
    .ab-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .ab-row:last-child { border-bottom: none; }
    .ab-row-name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .ab-row-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .ab-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex-shrink: 0; }
    .ab-seg button { background: var(--bg-secondary); color: var(--text-secondary); border: none; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .ab-seg button + button { border-left: 1px solid var(--border); }
    .ab-seg button.on-allow { background: var(--accent-green); color: #0a0e17; font-weight: 600; }
    .ab-seg button.on-block { background: var(--accent-red); color: #fff; font-weight: 600; }
    .ab-seg button.on-default { background: var(--accent-blue); color: #fff; font-weight: 600; }
    .ab-seg button:disabled { opacity: 0.4; cursor: not-allowed; }
    .ab-warn { color: var(--accent-amber); font-size: 11px; margin-top: 2px; }

    /* Plan/Diff View */
    .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .diff-table th {
      text-align: left; padding: 8px 12px;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
      font-weight: 600; color: var(--text-secondary); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .diff-table td {
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .diff-table tr:hover { background: var(--bg-card-hover); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }
    .badge-create { background: var(--accent-green-dim); color: var(--accent-green); }
    .badge-update { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .badge-risk { background: var(--accent-red-dim); color: var(--accent-red); }
    .badge-category { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); }

    /* Alerts */
    .alert {
      padding: 12px 16px; border-radius: var(--radius);
      margin-bottom: 1rem; font-size: 14px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .alert-info { background: var(--accent-blue-dim); border: 1px solid rgba(59,130,246,0.3); }
    .alert-warning { background: var(--accent-amber-dim); border: 1px solid rgba(245,158,11,0.3); color: var(--accent-amber); }
    .alert-success { background: var(--accent-green-dim); border: 1px solid rgba(16,185,129,0.3); color: var(--accent-green); }
    .alert-danger { background: var(--accent-red-dim); border: 1px solid rgba(239,68,68,0.3); color: var(--accent-red); }

    /* Explainer */
    .explainer {
      background: var(--bg-input);
      border-left: 3px solid var(--accent-cyan);
      padding: 12px 16px;
      margin: 1rem 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .explainer strong { color: var(--accent-cyan); }

    /* Compliance Evidence */
    .evidence-item {
      padding: 8px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      font-size: 13px;
    }
    .evidence-item .fw { color: var(--accent-purple); font-weight: 600; }
    .evidence-item .ctrl { color: var(--accent-cyan); }

    /* Audit Log */
    .log-entry {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      display: grid;
      grid-template-columns: 180px 120px 100px 1fr;
      gap: 8px;
    }
    .log-entry .ts { color: var(--text-muted); }
    .log-entry .action { color: var(--accent-cyan); font-weight: 500; }
    .log-entry .status-ok { color: var(--accent-green); }
    .log-entry .status-err { color: var(--accent-red); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ZPA placeholder */
    .placeholder-banner {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      color: var(--text-muted);
    }
    .placeholder-banner h3 { color: var(--text-secondary); margin-bottom: 8px; }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .content { padding: 1rem; }
      .tier-grid { grid-template-columns: 1fr; }
      .compliance-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row { grid-template-columns: 1fr; }
    }
    /* Policy Catalog */
    .catalog-tier { margin-bottom: 2rem; }
    .catalog-tier-header {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem;
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; user-select: none; font-weight: 600; font-size: 15px;
    }
    .catalog-tier-header:hover { background: var(--bg-card-hover); }
    .catalog-tier-header .arrow { transition: transform 0.2s; font-size: 11px; color: var(--text-muted); }
    .catalog-tier-header .arrow.open { transform: rotate(90deg); }
    .catalog-fw { margin: 0.5rem 0 0.5rem 1.5rem; }
    .catalog-fw-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; font-weight: 500; font-size: 13px;
    }
    .catalog-fw-header:hover { background: var(--bg-card-hover); }
    .catalog-policy-group { margin: 0.5rem 0 0.5rem 1rem; }
    .catalog-policy-header {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
      cursor: pointer; font-size: 13px; font-weight: 500; color: var(--accent-cyan);
    }
    .catalog-policy-header:hover { color: var(--accent-blue); }
    .catalog-rule {
      margin: 0.25rem 0 0.25rem 1.5rem; padding: 0.6rem 0.75rem;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; line-height: 1.6;
    }
    .catalog-rule-name { font-weight: 600; color: var(--text-primary); font-size: 13px; }
    .catalog-rule-action {
      display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 11px;
      font-weight: 600; margin-left: 0.5rem;
    }
    .catalog-rule-action.BLOCK { background: var(--accent-red-dim); color: var(--accent-red); }
    .catalog-rule-action.ALLOW { background: var(--accent-green-dim); color: var(--accent-green); }
    .catalog-rule-action.CAUTION { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .catalog-rule-action.INSPECT, .catalog-rule-action.DECRYPT { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
    .catalog-rule-action.DO_NOT_DECRYPT { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-action.QUARANTINE, .catalog-rule-action.QUARANTINE_ISOLATE { background: rgba(139,92,246,0.15); color: var(--accent-purple); }
    .catalog-rule-detail { color: var(--text-secondary); margin-top: 2px; }
    .catalog-rule-cats { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 3px; word-break: break-all; }
    .catalog-compliance-tag {
      display: inline-block; padding: 1px 6px; margin: 2px 3px 2px 0; border-radius: 3px;
      font-size: 10px; background: rgba(59,130,246,0.12); color: var(--accent-blue); font-family: 'IBM Plex Mono', monospace;
    }
    .catalog-count {
      display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
      background: var(--bg-input); color: var(--text-muted); margin-left: 0.5rem; font-weight: 400;
    }
    .catalog-loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    .catalog-summary { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
    .catalog-summary-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ========================
    // Error Boundary — catches React render crashes and shows debug info instead of black screen
    // ========================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        this.setState({ errorInfo });
        // Log to console for debugging
        console.error('[ZPW ErrorBoundary] Render crash caught:', error);
        console.error('[ZPW ErrorBoundary] Component stack:', errorInfo?.componentStack);
        // Also log to server error log
        try {
          const payload = {
            error: error?.message || String(error),
            stack: error?.stack,
            componentStack: errorInfo?.componentStack
          };
          console.error('[ZPW ErrorBoundary] Full details:', JSON.stringify(payload, null, 2));
        } catch(e) {}
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            style: { padding: '2rem', background: '#1a0000', border: '2px solid #ef4444',
                     borderRadius: '8px', margin: '1rem', color: '#fca5a5', fontFamily: 'monospace' }
          },
            React.createElement('h2', { style: { color: '#ef4444', marginBottom: '1rem' } }, '⚠ UI Render Error'),
            React.createElement('p', { style: { marginBottom: '1rem' } },
              'A React rendering error occurred. This is a bug — the data from the API could not be displayed. Details below:'),
            React.createElement('pre', {
              style: { fontSize: '12px', background: '#0a0a0a', padding: '1rem', borderRadius: '4px',
                       overflow: 'auto', maxHeight: '300px', whiteSpace: 'pre-wrap', color: '#fca5a5' }
            }, [
              'Error: ' + (this.state.error?.message || String(this.state.error)),
              '\n\nStack: ' + (this.state.error?.stack || 'N/A'),
              '\n\nComponent: ' + (this.state.errorInfo?.componentStack || 'N/A')
            ].join('')),
            React.createElement('p', { style: { marginTop: '1rem', fontSize: '12px', color: '#9ca3af' } },
              'Check the browser developer console (F12 → Console tab) for full details. ' +
              'Also check the server logs in ./logs/ for API-side errors.'),
            React.createElement('button', {
              onClick: () => this.setState({ hasError: false, error: null, errorInfo: null }),
              style: { marginTop: '1rem', padding: '8px 16px', background: '#ef4444', color: 'white',
                       border: 'none', borderRadius: '4px', cursor: 'pointer' }
            }, '🔄 Try Again')
          );
        }
        return this.props.children;
      }
    }

    // ========================
    // App Version
    // ========================
    const APP_VERSION = '1.0.0';
    const BUILD_DATE = '2026-03-30';

    // ========================
    // API Helper
    // ========================
    const api = {
      sessionId: null,
      async call(method, path, body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (this.sessionId) headers['X-Session-Id'] = this.sessionId;
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(`/api${path}`, opts);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      }
    };

    // ========================
    // Wizard Steps
    // ========================
    const WIZARD_STEPS = [
      { id: 'framework', label: 'Framework', icon: '🛡️' },
      { id: 'customize', label: 'Customize', icon: '⚙️' },
      { id: 'actions', label: 'Rules', icon: '🚦' },
      { id: 'review', label: 'Review Plan', icon: '🔍' },
      { id: 'apply', label: 'Apply', icon: '🚀' },
      { id: 'audit', label: 'Audit Log', icon: '📄' }
    ];

    // ========================
    // Main App
    // ========================
    function App() {
      // Navigation: activeModule = 'zia-wizard' | 'zia-bulk' | 'catalog' | 'about' | null
      const [activeModule, setActiveModule] = useState(null);
      const [step, setStep] = useState('connect');
      const [auth, setAuth] = useState({ connected: false, mode: null, cloud: null });
      const [config, setConfig] = useState({
        module: 'zia',
        tier: 'STRICT',
        complianceFramework: 'DOW_STANDARD',
        prefix: 'GOV',
        disabledRules: {}, disabledSettings: {}, blockedCountries: null, cbiProfile: null, baseTemplate: null, loadedFramework: null,
        enableUrlFiltering: true,
        enableFirewall: true,
        enableSslInspection: true,
        enableMalwareProtection: true,
        enableAdvancedSettings: true,
        enableSandbox: true,
        enableDnsSecurity: true,
        enableFileTypeControl: true,
        enableCloudAppControl: true,
        enableDlp: true,
        // v1.6.0 Allow/Block choices: policy-level ('DEFAULT'|'ALLOW'|'BLOCK') + per-rule overrides
        actionSettings: { policy: {}, rules: {} },
        // GovCloud edition default: DOW Standard sheet modules on, the optional baseline modules off
        ...DOW_SHEET_MODULES, ...DOW_EXTRA_OFF
      });
      const [template, setTemplate] = useState(null);
      const [plan, setPlan] = useState(null);
      const [applyResult, setApplyResult] = useState(null);
      const [auditLogs, setAuditLogs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [completedSteps, setCompletedSteps] = useState(new Set());

      const markComplete = (s) => setCompletedSteps(prev => new Set([...prev, s]));

      const goTo = (s) => {
        setError(null);
        // Clear downstream state when going back in the wizard
        const stepOrder = ['framework', 'customize', 'actions', 'review', 'apply', 'audit'];
        const targetIdx = stepOrder.indexOf(s);
        if (targetIdx >= 0) {
          if (targetIdx < stepOrder.indexOf('review')) { setPlan(null); }
          if (targetIdx < stepOrder.indexOf('apply')) { setApplyResult(null); }
          if (targetIdx < stepOrder.indexOf('actions')) { setTemplate(null); }
        }
        setStep(s);
      };

      const switchModule = (mod) => {
        setError(null);
        setActiveModule(mod);
        if (mod === 'zia-wizard') {
          // Reset wizard state so user can run a fresh deployment
          setStep('framework');
          setTemplate(null);
          setPlan(null);
          setApplyResult(null);
          setCompletedSteps(new Set());
        }
        else if (mod === 'zia-bulk') setStep('bulk-delete');
        else if (mod === 'zia-ssl') setStep('ssl-certs');
        else if (mod === 'about') setStep('about');
        else if (mod === 'catalog') setStep('catalog');
      };

      const showConnect = !auth.connected && activeModule !== 'catalog' && activeModule !== 'about';
      const showZiaWizard = auth.connected && activeModule === 'zia-wizard';
      const showZiaBulk = auth.connected && activeModule === 'zia-bulk';
      const showAbout = activeModule === 'about';
      const showCatalog = activeModule === 'catalog';
      const ziaExpanded = activeModule === 'zia-wizard' || activeModule === 'zia-bulk' || activeModule === 'zia-ssl';
      const showZiaSsl = auth.connected && activeModule === 'zia-ssl';

      return (
        <div className="app">
          <header className="header">
            <div className="header-brand">
              <div className="logo" aria-hidden="true" style={{display:'flex', alignItems:'center', justifyContent:'center'}}>
                <svg width="20" height="22" viewBox="0 0 20 22" fill="none"><path d="M10 1 2 4v6c0 5.2 3.4 9.4 8 11 4.6-1.6 8-5.8 8-11V4l-8-3Z" fill="currentColor" opacity=".18" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round"/><path d="m6.5 11 2.4 2.4 4.6-4.8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
              <div>
                <h1 style={{fontSize:'15px', lineHeight:1.2}}>Zscaler Policy Wizard <span style={{color:'var(--accent-cyan)'}}>GovCloud Edition</span></h1>
                <div style={{fontSize:'10.5px', color:'var(--text-muted, #8b95a7)', marginTop:'2px', letterSpacing:'.2px'}}>Coded by Steven Hajny, Distinguished Engineer</div>
              </div>
              <span className="tag">v{APP_VERSION}</span>
            </div>
            <div className="header-right">
              <div className={`auth-badge ${auth.connected ? 'connected' : 'disconnected'}`}>
                <span className="dot"></span>
                {auth.connected ? `${auth.mode?.toUpperCase()} · ${auth.cloud}` : 'Not Connected'}
              </div>
              {auth.connected && (
                <button className="btn btn-ghost btn-sm" onClick={async () => {
                  try { await api.call('POST', '/auth/logout'); } catch(e) {}
                  api.sessionId = null; setAuth({ connected: false }); setActiveModule(null); setCompletedSteps(new Set()); goTo('connect');
                }}>Disconnect</button>
              )}
            </div>
          </header>
          <div className="main">
            <nav className="sidebar">
              <div className="sidebar-section">
                <div className="sidebar-item" style={{opacity: auth.connected ? 0.5 : 1}}
                  onClick={() => { if (!auth.connected) { setActiveModule(null); setStep('connect'); }}}>
                  <span className="step-num">{auth.connected ? '✓' : '🔌'}</span>
                  {auth.connected ? 'Connected' : 'Connect'}
                </div>
              </div>
              {auth.connected && (
                <div className="sidebar-section">
                  <div className="sidebar-section-title">Modules</div>
                  <div className={`sidebar-item ${ziaExpanded ? 'active' : ''}`}
                    onClick={() => switchModule('zia-wizard')} style={{cursor:'pointer', fontWeight: ziaExpanded ? 600 : 400}}>
                    <span className="step-num">🌐</span> Zscaler Internet Access
                  </div>
                  {ziaExpanded && (<>
                    <div className={`sidebar-item ${activeModule === 'zia-wizard' ? 'active' : ''}`}
                      onClick={() => switchModule('zia-wizard')} style={{paddingLeft:'2.2rem', fontSize:'12px', cursor:'pointer'}}>
                      <span className="step-num" style={{fontSize:'10px', width:'16px', height:'16px'}}>🛡️</span> Policy Wizard
                    </div>
                    <div className={`sidebar-item ${activeModule === 'zia-ssl' ? 'active' : ''}`} data-nav="ssl"
                      onClick={() => switchModule('zia-ssl')} style={{paddingLeft:'2.2rem', fontSize:'12px', cursor:'pointer'}}>
                      <span className="step-num" style={{fontSize:'10px', width:'16px', height:'16px'}}>🔐</span> SSL Certificate Manager
                    </div>
                    <div className={`sidebar-item ${activeModule === 'zia-bulk' ? 'active' : ''}`}
                      onClick={() => switchModule('zia-bulk')} style={{paddingLeft:'2.2rem', fontSize:'12px', cursor:'pointer'}}>
                      <span className="step-num" style={{fontSize:'10px', width:'16px', height:'16px'}}>🗑️</span> Bulk Rule Manager
                    </div>
                  </>)}
                  {showZiaWizard && WIZARD_STEPS.map((s, i) => (
                    <div key={s.id} className={`sidebar-item ${step === s.id ? 'active' : ''} ${completedSteps.has(s.id) ? 'completed' : ''}`}
                      onClick={() => { if (completedSteps.has(s.id) || step === s.id) goTo(s.id); }}
                      style={{paddingLeft:'3.2rem', fontSize:'11px', cursor: completedSteps.has(s.id) ? 'pointer' : 'default'}}>
                      <span className="step-num" style={{fontSize:'9px', width:'15px', height:'15px'}}>{completedSteps.has(s.id) ? '✓' : i + 1}</span> {s.label}
                    </div>
                  ))}
                </div>
              )}
              <div className="sidebar-section" style={{marginTop:'auto'}}>
                <div className={`sidebar-item ${activeModule === 'catalog' ? 'active' : ''}`}
                  onClick={() => switchModule('catalog')} style={{cursor:'pointer', fontSize:'12px'}}>
                  <span className="step-num" style={{fontSize:'10px'}}>📖</span> Policy Catalog
                </div>
                <div className={`sidebar-item ${activeModule === 'about' ? 'active' : ''}`}
                  onClick={() => switchModule('about')} style={{cursor:'pointer', fontSize:'12px'}}>
                  <span className="step-num" style={{fontSize:'10px'}}>ℹ️</span> About
                </div>
              </div>
            </nav>
            <div className={`content ${step === 'review' ? 'content-wide' : ''}`}>
              {error && <div className="alert alert-danger">⚠ {error}</div>}
              {showConnect && (<ConnectStep auth={auth} setAuth={setAuth} setError={setError} loading={loading} setLoading={setLoading}
                onComplete={() => { markComplete('connect'); setActiveModule(null); setStep('select'); }} />)}
              {auth.connected && !activeModule && (
                <div className="card">
                  <div className="card-header"><h2>Welcome to Zscaler Policy Wizard — GovCloud Edition</h2><p>Select a module from the sidebar or choose below.</p></div>
                  <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem', margin:'1rem 0'}}>
                    <div className="tier-card" onClick={() => switchModule('zia-wizard')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">🌐</div><div className="tier-name">ZIA Security Wizard</div>
                      <div className="tier-desc">Apply the DOW Standard, NIST 800-53 or NIST 800-171 — or a saved / captured framework — with an on/off switch for every rule.</div>
                    </div>
                    <div className="tier-card" onClick={() => switchModule('catalog')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">📖</div><div className="tier-name">Policy Catalog</div>
                      <div className="tier-desc">The DOW category sheet mapping and every rule each framework creates, before you connect.</div>
                    </div>
                    <div className="tier-card" onClick={() => switchModule('about')} style={{cursor:'pointer'}}>
                      <div className="tier-icon">ℹ️</div><div className="tier-name">About</div>
                      <div className="tier-desc">Documentation, modules, compliance frameworks, version history.</div>
                    </div>
                  </div>
                </div>
              )}
              {showCatalog && (<CatalogStep />)}
              {showAbout && (
                <div className="card">
                  <div className="card-header"><h2>Zscaler Policy Wizard — GovCloud Edition</h2><p>ZIA policy automation over the legacy ZIA API only. Coded by Steven Hajny, Distinguished Engineer.</p></div>
                  <div style={{fontSize:'13px', color:'var(--text-secondary)', lineHeight:'1.8'}}>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1rem 0 0.5rem'}}>Frameworks</h3>
                    <div style={{paddingLeft:'1rem'}}>
                      <div>• <strong>DOW Standard</strong> — Block / Allow lists from the DOW category sheet; every other URL category isolated in Cloud Browser Isolation; ATP (P2P, cryptomining, botnet, compromised host, phishing, spam) with China, Russia, Iran, Iraq, Somalia and North Korea blocked; IPS Command and Control; Sandbox malware and ransomware; Flash blocked</div>
                      <div>• <strong>NIST 800-53 Rev 5</strong> and <strong>NIST 800-171</strong> — on a Strict, Balanced or Permissive baseline</div>
                      <div>• <strong>Your own</strong> — save any configuration as a framework file and load it into another tenant, or capture a tenant's current policies as a framework</div>
                    </div>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Rules</h3>
                    <p>Every rule in every policy area, and every ATP setting, has its own on/off switch. Allow / Block can be overridden where the policy type supports it. Dry run matches categories, the isolation profile and the IPS threat category to the tenant before anything is written; apply reads ATP back to confirm it.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Legacy API</h3>
                    <p>Signs in with POST /api/v1/authenticatedSession (admin username, password and the obfuscated API key) on the zsapi host for your cloud. A credentials file (GovCloudAPI.txt, or APISpecial.txt) next to the app can be used instead of typing. Calls are paced for the legacy rate limits; changes are activated at the end of apply.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Not done through the API</h3>
                    <p>Cloud Browser Isolation profiles are created in the Isolation portal (the ZIA API only reads them). Malware Protection and Advanced Cloud Settings are shown for review only.</p>
                    <h3 style={{fontSize:'15px', color:'var(--accent-cyan)', margin:'1.5rem 0 0.5rem'}}>Version</h3>
                    <div style={{paddingLeft:'1rem', fontSize:'12px'}}>
                      <div><strong>1.0.0</strong> — First GovCloud Edition release: ZIA only over the legacy API; DOW Standard + NIST 800-53 / 800-171; per-rule and per-setting toggles; ATP with country blocking; IPS Command and Control; Cloud Browser Isolation with the default profile and refresh; Sandbox malware and ransomware; DOW SSL inspection with Health / Finance exemptions; interception certificate picker and SSL Certificate Manager; framework save / upload / tenant capture</div>
                    </div>
                  </div>
                </div>
              )}
              {showZiaWizard && step === 'framework' && (<FrameworkStep config={config} setConfig={setConfig} setError={setError} loading={loading} setLoading={setLoading} auth={auth}
                onNext={() => { markComplete('framework'); goTo('customize'); }} />)}
              {showZiaWizard && step === 'customize' && (<CustomizeStep config={config} setConfig={setConfig} auth={auth}
                setTemplate={setTemplate} setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('customize'); goTo('actions'); }} onBack={() => goTo('framework')} />)}
              {showZiaWizard && step === 'actions' && (<ActionsStep config={config} setConfig={setConfig}
                setTemplate={setTemplate} setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('actions'); goTo('review'); }} onBack={() => goTo('customize')} />)}
              {showZiaWizard && step === 'review' && (<ReviewStep template={template} plan={plan} setPlan={setPlan}
                auth={auth} setError={setError} loading={loading} setLoading={setLoading}
                onApply={() => { markComplete('review'); goTo('apply'); }} onBack={() => goTo('actions')} />)}
              {showZiaWizard && step === 'apply' && (<ApplyStep template={template} plan={plan}
                applyResult={applyResult} setApplyResult={setApplyResult}
                setError={setError} loading={loading} setLoading={setLoading}
                onNext={() => { markComplete('apply'); goTo('audit'); }} />)}
              {showZiaWizard && step === 'audit' && (<AuditStep auditLogs={auditLogs} setAuditLogs={setAuditLogs} setError={setError} />)}
              {showZiaSsl && (<SslCertStep setError={setError} />)}
              {showZiaBulk && (<BulkDeleteStep setError={setError} loading={loading} setLoading={setLoading} />)}
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Connect
    // ========================
    function ConnectStep({ auth, setAuth, setError, loading, setLoading, onComplete }) {
      const [form, setForm] = useState({ baseUrl: '', username: '', password: '', apiKey: '' });
      const [credFile, setCredFile] = useState(null);
      useEffect(() => { api.call('GET', '/auth/cred-file').then(setCredFile).catch(() => {}); }, []);

      const finish = (result) => {
        api.sessionId = result.sessionId;
        setAuth({ connected: true, mode: 'legacy', cloud: result.host });
        onComplete();
      };
      const handleConnect = async () => {
        setLoading(true); setError(null);
        try { finish(await api.call('POST', '/auth/legacy', form)); }
        catch (e) { setError(e.message); }
        setLoading(false);
      };
      const connectFromFile = async () => {
        setLoading(true); setError(null);
        try { finish(await api.call('POST', '/auth/cred-file')); }
        catch (e) { setError(e.message); }
        setLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Connect to ZIA (legacy API)</h2>
              <p>This edition uses the legacy ZIA API only: an administrator's username and password plus the organization's API key. Nothing else in Zscaler is touched.</p>
            </div>
            {credFile && credFile.found && (
              <div className={`alert ${credFile.complete ? 'alert-info' : 'alert-warning'}`} style={{display:'block'}} data-credfile>
                <div><strong>Credentials file found:</strong> {credFile.file}</div>
                {credFile.error ? <div>{credFile.error}</div> : (
                  <div style={{fontSize:'12px', marginTop:'4px'}}>
                    Base URL: {credFile.baseUrl || <em>missing</em>} · Username: {credFile.username || <em>missing</em>} · Password: {credFile.hasPassword ? 'present' : <em>missing</em>} · API key: {credFile.hasApiKey ? 'present' : <em>missing</em>}
                  </div>
                )}
                {credFile.complete && (
                  <button className="btn btn-primary btn-sm" style={{marginTop:'8px'}} onClick={connectFromFile} disabled={loading}>
                    {loading ? <><span className="spinner"></span> Connecting...</> : 'Connect with this file'}
                  </button>
                )}
                {!credFile.complete && !credFile.error && <div style={{fontSize:'12px', marginTop:'4px'}}>Add the missing values to the file (one per line, or name=value) and reopen this page, or type them below.</div>}
              </div>
            )}
            <div className="explainer">
              <strong>Where these come from:</strong> ZIA Admin Portal › Administration › Cloud Service API Security (API Key Management) shows the API key and your API base URL (for example <code>https://zsapi.zscalertwo.net</code>). The admin needs an admin role with API access. Sessions follow the legacy API rules: signed out after 30 minutes idle, and calls are paced to stay inside the rate limits.
            </div>
            <div>
              <div className="form-group">
                <label className="form-label">API base URL</label>
                <input type="text" value={form.baseUrl} placeholder="https://zsapi.zscalertwo.net"
                  onChange={e => setForm({...form, baseUrl: e.target.value})} />
                <div className="form-hint">The zsapi host for your cloud; a cloud name such as <code>zscalertwo</code> also works.</div>
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Admin username</label>
                  <input type="text" value={form.username} placeholder="admin@agency.mil" autoComplete="username"
                    onChange={e => setForm({...form, username: e.target.value})} />
                </div>
                <div className="form-group">
                  <label className="form-label">Password</label>
                  <input type="password" value={form.password} autoComplete="current-password"
                    onChange={e => setForm({...form, password: e.target.value})} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">API key</label>
                <input type="password" value={form.apiKey} placeholder="12-character key" autoComplete="off"
                  onChange={e => setForm({...form, apiKey: e.target.value})} />
              </div>
            </div>
            <div className="btn-group">
              <button className="btn btn-primary" onClick={handleConnect} disabled={loading}>
                {loading ? <><span className="spinner"></span> Connecting...</> : 'Connect & Authenticate'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Module Select
    // ========================
    function ModuleStep({ config, setConfig, onNext }) {
      const [schema, setSchema] = useState(null);
      const [schemaLoading, setSchemaLoading] = useState(false);
      const [schemaError, setSchemaError] = useState(null);

      const fetchSchema = async () => {
        setSchemaLoading(true); setSchemaError(null);
        try {
          const data = await api.call('GET', '/diag/schema');
          setSchema(data);
        } catch (e) { setSchemaError(e.message); }
        setSchemaLoading(false);
      };

      return (
        <div>
          <div className="card">
            <div className="card-header">
              <h2>Select Modules</h2>
              <p>Choose which Zscaler modules to configure. The MVP focuses on ZIA.</p>
            </div>

            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'1rem', margin:'1rem 0'}}>
              <div className={`tier-card selected`} style={{borderColor:'var(--accent-green)'}}>
                <div className="tier-icon">🌐</div>
                <div className="tier-name">Zscaler Internet Access</div>
                <div className="tier-desc">URL Filtering, Cloud Firewall, SSL Inspection, DLP, Sandbox, Cloud App Control, Malware Protection</div>
                <div style={{marginTop:'8px', color:'var(--accent-green)', fontSize:'12px', fontWeight:600}}>✓ ACTIVE</div>
              </div>
              <div className="placeholder-banner" style={{border:'1px dashed var(--border)'}}>
                <div className="tier-icon" style={{fontSize:'28px'}}>🔒</div>
                <h3>Zscaler Private Access</h3>
                <div className="tier-desc">App Segments, Access Policies, Wildcard Rules — Coming in a future release</div>
                <div style={{marginTop:'8px', color:'var(--text-muted)', fontSize:'12px'}}>PLACEHOLDER</div>
              </div>
            </div>

            <div className="card" style={{background:'var(--bg-input)', marginTop:'1rem'}}>
              <div className="card-header">
                <h3>API Schema Discovery</h3>
                <p>Fetch a sample of your tenant's current rules to verify API connectivity and field formats.</p>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={fetchSchema} disabled={schemaLoading}>
                {schemaLoading ? <><span className="spinner"></span> Fetching...</> : '🔍 Fetch Tenant Schema'}
              </button>
              {schemaError && <div className="alert alert-danger" style={{marginTop:'8px'}}>⚠ {schemaError}</div>}
              {schema && (
                <div style={{marginTop:'12px', maxHeight:'400px', overflowY:'auto'}}>
                  {Object.entries(schema).map(([key, val]) => (
                    <div key={key} style={{marginBottom:'12px'}}>
                      <div style={{fontWeight:600, fontSize:'13px', color:'var(--accent-cyan)', marginBottom:'4px'}}>{key}</div>
                      {val.error ? (
                        <div style={{fontSize:'12px', color:'var(--accent-red)'}}>Error: {val.error}</div>
                      ) : (
                        <pre style={{
                          fontSize:'11px', fontFamily:'IBM Plex Mono', color:'var(--text-secondary)',
                          background:'var(--bg-primary)', padding:'8px', borderRadius:'4px',
                          overflow:'auto', maxHeight:'200px', whiteSpace:'pre-wrap', wordBreak:'break-all'
                        }}>{JSON.stringify(val, null, 2)}</pre>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="btn-group">
              <button className="btn btn-primary" onClick={onNext}>Continue with ZIA →</button>
            </div>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Security Tier
    // ========================
    // Step: Framework (GovCloud edition) — DOW Standard, NIST 800-53 / 800-171 on a tier,
    // a saved framework file, or a capture of the connected tenant
    // ========================
    const DOW_SHEET_MODULES = { enableUrlFiltering: true, enableAtp: true, enableIps: true, enableSandbox: true, enableFileTypeControl: true, enableSslInspection: true };
    const DOW_EXTRA_OFF = { enableFirewall: false, enableDnsSecurity: false, enableCloudAppControl: false, enableDlp: false, enableMalwareProtection: false, enableAdvancedSettings: false };
    const ALL_MODULES_ON = { enableUrlFiltering: true, enableFirewall: true, enableSslInspection: true, enableSandbox: true, enableDnsSecurity: true, enableFileTypeControl: true,
      enableCloudAppControl: true, enableDlp: true, enableMalwareProtection: true, enableAdvancedSettings: true, enableAtp: true, enableIps: true };
    const freshToggles = { actionSettings: { policy: {}, rules: {} }, disabledRules: {}, disabledSettings: {}, blockedCountries: null };

    const downloadJson = (filename, obj) => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    };
    const saveFramework = async (config, setError, defaultName) => {
      const name = window.prompt('Name for this framework file:', defaultName || 'DOW Standard');
      if (!name) return;
      try {
        const { baseTemplate, ...rest } = config;
        const file = await api.call('POST', '/frameworks/build', { name, config: { ...rest, ...(baseTemplate ? { baseTemplate } : {}) } });
        downloadJson(`${name.replace(/[^\w.-]+/g, '_')}.zpw-framework.json`, file);
      } catch (e) { setError('Could not save the framework: ' + e.message); }
    };

    function FrameworkStep({ config, setConfig, setError, loading, setLoading, auth, onNext }) {
      const [loaded, setLoaded] = useState(config.loadedFramework || null);
      const [captureNotes, setCaptureNotes] = useState(null);
      const builtIn = [
        { id: 'DOW_STANDARD', icon: '🛡️', name: 'DOW Standard', desc: 'From the DOW category sheet: Block and Allow lists, every other category isolated in Cloud Browser Isolation, ATP (P2P, cryptomining, botnet, compromised host, phishing, spam) with China, Russia, Iran, Iraq, Somalia and North Korea blocked, IPS Command and Control, Sandbox malware and ransomware, Flash blocked.' },
        { id: 'NIST_800_53', icon: '🏛️', name: 'NIST 800-53 Rev 5', desc: 'Security and privacy controls for federal information systems, on a Strict, Balanced or Permissive baseline.' },
        { id: 'NIST_800_171', icon: '📁', name: 'NIST 800-171', desc: 'Protecting Controlled Unclassified Information (CUI) in non-federal systems, on a Strict, Balanced or Permissive baseline.' }
      ];
      const tiers = [
        { id: 'STRICT', name: 'Strict', desc: 'Maximum security, full SSL inspection, default-deny firewall' },
        { id: 'BALANCED', name: 'Balanced', desc: 'Best-practice security with reasonable access' },
        { id: 'PERMISSIVE', name: 'Permissive', desc: 'Core security only' }
      ];
      const usingFile = !!config.baseTemplate || (loaded && loaded.kind === 'built-in' && config.loadedFramework);

      const pick = (id) => {
        setLoaded(null); setCaptureNotes(null);
        setConfig(c => ({ ...c, ...freshToggles, baseTemplate: null, loadedFramework: null, complianceFramework: id,
          tier: c.tier && c.tier !== 'DOW_STANDARD' ? c.tier : 'STRICT',
          ...(id === 'DOW_STANDARD' ? { ...DOW_SHEET_MODULES, ...DOW_EXTRA_OFF } : { ...ALL_MODULES_ON, enableIps: false }) }));
      };
      const applyFramework = (out) => {
        const info = { name: out.name, kind: out.kind, savedAt: out.savedAt, description: out.description, counts: out.counts };
        setLoaded(info);
        setConfig(c => ({ ...c, ...freshToggles, ...ALL_MODULES_ON,
          ...(out.config.complianceFramework === 'DOW_STANDARD' ? { ...DOW_SHEET_MODULES, ...DOW_EXTRA_OFF } : {}),
          baseTemplate: null, cbiProfile: null, ...out.config, loadedFramework: info,
          prefix: out.config.prefix !== undefined ? out.config.prefix : c.prefix,
          complianceFramework: out.config.complianceFramework || (out.config.baseTemplate ? null : c.complianceFramework) }));
      };
      const onFile = (file) => {
        if (!file) return;
        const rd = new FileReader();
        rd.onload = async () => {
          setError(null);
          try { applyFramework(await api.call('POST', '/frameworks/read', { framework: JSON.parse(rd.result) })); }
          catch (e) { setError('Could not load that framework: ' + e.message); }
        };
        rd.readAsText(file);
      };
      const capture = async () => {
        setLoading(true); setError(null);
        try {
          const r = await api.call('POST', '/frameworks/capture', {});
          setCaptureNotes({ notes: r.notes, skipped: r.skipped, file: r.framework });
          applyFramework(await api.call('POST', '/frameworks/read', { framework: r.framework }));
        } catch (e) { setError('Capture failed: ' + e.message); }
        setLoading(false);
      };

      return (
        <div className="card">
          <div className="card-header">
            <h2>Choose a Framework</h2>
            <p>Start from a built-in framework, a framework file you saved earlier (from any tenant), or capture the policies of the tenant you're connected to.</p>
          </div>
          {loaded ? (
            <div className="alert alert-info" style={{display:'block'}} data-loadedframework>
              <div><strong>Framework loaded:</strong> {loaded.name} <span className="badge badge-category" style={{marginLeft:'6px'}}>{loaded.kind === 'captured' ? 'CAPTURED POLICIES' : 'BUILT-IN + YOUR CHOICES'}</span></div>
              {loaded.description && <div style={{fontSize:'12px'}}>{loaded.description}</div>}
              {loaded.counts && <div style={{fontSize:'12px', marginTop:'4px'}}>{Object.entries(loaded.counts).map(([k, v]) => `${k}: ${v}`).join(' · ')}</div>}
              <div style={{display:'flex', gap:'8px', marginTop:'8px'}}>
                {captureNotes && <button className="btn btn-ghost btn-sm" onClick={() => downloadJson(`${(loaded.name || 'captured').replace(/[^\w.-]+/g, '_')}.zpw-framework.json`, captureNotes.file)}>Download this capture</button>}
                <button className="btn btn-ghost btn-sm" onClick={() => pick(config.complianceFramework || 'DOW_STANDARD')}>Clear and use a built-in framework</button>
              </div>
            </div>
          ) : (
            <>
              <div className="tier-grid">
                {builtIn.map(f => (
                  <div key={f.id} data-framework={f.id} className={`tier-card ${config.complianceFramework === f.id ? 'selected' : ''}`} onClick={() => pick(f.id)}>
                    <div className="tier-icon">{f.icon}</div>
                    <div className="tier-name">{f.name}</div>
                    <div className="tier-desc">{f.desc}</div>
                  </div>
                ))}
              </div>
              {config.complianceFramework && config.complianceFramework !== 'DOW_STANDARD' && (
                <div className="form-group">
                  <label className="form-label">Baseline</label>
                  <div className="ab-seg" data-tierpick>
                    {tiers.map(t => <button key={t.id} className={config.tier === t.id ? 'on-default' : ''} title={t.desc} onClick={() => setConfig(c => ({ ...c, tier: t.id, ...freshToggles }))}>{t.name}</button>)}
                  </div>
                  <div className="form-hint">{(tiers.find(t => t.id === config.tier) || {}).desc}</div>
                </div>
              )}
            </>
          )}
          {captureNotes && (captureNotes.notes.length > 0 || captureNotes.skipped.length > 0) && (
            <details style={{fontSize:'12px', marginBottom:'1rem'}} open>
              <summary style={{cursor:'pointer'}}>What the capture couldn't carry over ({captureNotes.notes.length + captureNotes.skipped.length})</summary>
              {[...captureNotes.skipped, ...captureNotes.notes].map((n, i) => <div key={i} style={{color:'var(--text-secondary)'}}>• {n}</div>)}
            </details>
          )}
          <div style={{display:'flex', gap:'8px', flexWrap:'wrap', alignItems:'center'}}>
            <label className="btn btn-ghost" style={{cursor:'pointer'}} data-uploadframework>📂 Load a saved framework…
              <input type="file" accept=".json,application/json" style={{display:'none'}} onChange={e => { onFile(e.target.files[0]); e.target.value = ''; }} />
            </label>
            <button className="btn btn-ghost" onClick={capture} disabled={loading || !auth.connected} data-capture>
              {loading ? <><span className="spinner"></span> Reading the tenant…</> : '📥 Capture this tenant\'s policies'}
            </button>
          </div>
          <div className="form-hint">Saved framework files carry your on/off toggles, Allow/Block choices, blocked countries and isolation profile name. A capture reads URL Filtering (with its custom categories), Cloud Firewall, IPS, SSL Inspection, Sandbox, DNS Control, File Type Control and ATP settings — read-only — so you can apply the same policy to another tenant.</div>
          <div className="btn-group">
            <button className="btn btn-primary" onClick={onNext} disabled={!config.complianceFramework && !config.baseTemplate} data-next>Next: Customize →</button>
          </div>
        </div>
      );
    }

    // ========================
    // ========================
    // SSL interception certificate picker (Customize) + SSL Certificate Manager page (GovCloud edition)
    // ========================
    function useSslCertificates(enabled) {
      const [state, setState] = useState(null);
      const load = () => { setState(null); api.call('GET', '/ssl/certificates').then(setState).catch(e => setState({ error: e.message, certificates: [] })); };
      useEffect(() => { if (enabled) load(); }, [enabled]);
      return [state, load];
    }

    function CertificatePicker({ value, onChange, certs, reload, testId }) {
      const [manual, setManual] = useState(false);
      const [mId, setMId] = useState(''); const [mName, setMName] = useState('');
      const list = (certs && certs.certificates) || [];
      return (
        <div data-certpicker={testId || 'cert'}>
          <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
            <select style={{flex:1}} value={value ? String(value.id) : ''} onChange={e => {
              if (e.target.value === '__manual') { setManual(true); return; }
              setManual(false);
              const c = list.find(x => String(x.id) === e.target.value);
              onChange(c ? { id: c.id, name: c.name } : null);
            }}>
              <option value="">Zscaler default certificate</option>
              {list.filter(c => !c.defaultCertificate).map(c => <option key={c.id} value={String(c.id)}>{c.name}{c.type ? ` (${c.type})` : ''}{c.from && c.from !== 'certificate list' ? ` — ${c.from}` : ''}</option>)}
              {value && !list.some(c => String(c.id) === String(value.id)) && <option value={String(value.id)}>{value.name} (entered)</option>}
              <option value="__manual">Enter a certificate ID…</option>
            </select>
            <button className="btn btn-ghost btn-sm" onClick={reload} title="Fetch certificates again (picks up newly imported ones)">↻ Refresh</button>
          </div>
          {!certs ? <div className="form-hint"><span className="spinner"></span> Reading certificates…</div>
            : certs.error ? <div className="form-hint" style={{color:'var(--accent-amber)'}}>Could not read certificates: {certs.error}</div>
            : !certs.source && <div className="form-hint">This tenant's API didn't return a certificate list{list.length ? '; showing certificates already used by SSL rules' : ''}. You can enter the certificate ID and name from Administration › Intermediate Root Certificates.</div>}
          {manual && (
            <div style={{display:'flex', gap:'6px', marginTop:'6px'}}>
              <input type="text" placeholder="Certificate ID" value={mId} onChange={e => setMId(e.target.value.replace(/[^0-9]/g, ''))} style={{width:'140px'}} />
              <input type="text" placeholder="Certificate name (as in the portal)" value={mName} onChange={e => setMName(e.target.value)} style={{flex:1}} />
              <button className="btn btn-ghost btn-sm" disabled={!mId || !mName} onClick={() => { onChange({ id: Number(mId), name: mName.trim() }); setManual(false); }}>Use</button>
            </div>
          )}
        </div>
      );
    }

    function SslCertStep({ setError }) {
      const [rules, setRules] = useState(null);
      const [certs, reloadCerts] = useSslCertificates(true);
      const [selected, setSelected] = useState({});
      const [target, setTarget] = useState(null);
      const [preview, setPreview] = useState(null);
      const [result, setResult] = useState(null);
      const [busy, setBusy] = useState(false);
      const loadRules = () => { setRules(null); api.call('GET', '/ssl/rules').then(setRules).catch(e => setError(e.message)); };
      useEffect(() => { loadRules(); }, []);
      const ids = Object.keys(selected).filter(k => selected[k]);
      const changeable = (rules || []).filter(r => r.changeable);
      const run = async (dryRun) => {
        setBusy(true); setError(null);
        try {
          const r = await api.call('POST', '/ssl/bulk-certificate', { ruleIds: ids, certificate: target, dryRun });
          if (dryRun) setPreview(r); else { setResult(r); setPreview(null); loadRules(); }
        } catch (e) { setError(e.message); }
        setBusy(false);
      };
      return (
        <div className="card">
          <div className="card-header">
            <h2>🔐 SSL Certificate Manager</h2>
            <p>Choose which interception certificate your SSL Inspect rules use — for example, stop using the Zscaler default certificate and sign with your imported intermediate CA. Only Inspect (DECRYPT) rules use a certificate.</p>
          </div>
          <div className="form-group">
            <label className="form-label">Certificate to use</label>
            <CertificatePicker value={target} onChange={(c) => { setTarget(c); setPreview(null); setResult(null); }} certs={certs} reload={reloadCerts} testId="bulk" />
          </div>
          {!rules ? <div style={{textAlign:'center', padding:'1rem'}}><span className="spinner"></span></div> : (
            <>
              <div style={{display:'flex', gap:'8px', marginBottom:'8px'}}>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelected(Object.fromEntries(changeable.map(r => [r.id, true])))}>Select all Inspect rules ({changeable.length})</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelected(Object.fromEntries(changeable.filter(r => !r.override).map(r => [r.id, true])))}>Select rules on the default certificate</button>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelected({})}>Clear</button>
                <button className="btn btn-ghost btn-sm" onClick={loadRules}>↻ Reload rules</button>
              </div>
              <table className="diff-table" data-sslrules>
                <thead><tr><th></th><th>Order</th><th>Rule</th><th>Action</th><th>Certificate</th></tr></thead>
                <tbody>
                  {rules.map(r => (
                    <tr key={r.id} style={{opacity: r.changeable ? 1 : 0.5}}>
                      <td><input type="checkbox" disabled={!r.changeable} checked={!!selected[r.id]} onChange={e => { setSelected({ ...selected, [r.id]: e.target.checked }); setPreview(null); }} /></td>
                      <td>{r.order}</td>
                      <td style={{fontFamily:'IBM Plex Mono', fontSize:'12px'}}>{r.name}{r.predefined && <span className="badge badge-category" style={{marginLeft:'6px'}}>PREDEFINED</span>}{r.defaultRule && <span className="badge badge-category" style={{marginLeft:'6px'}}>DEFAULT RULE</span>}</td>
                      <td><span className={`badge ${r.action === 'DECRYPT' ? 'badge-update' : 'badge-category'}`}>{r.action === 'DECRYPT' ? 'INSPECT' : r.action}</span></td>
                      <td style={{fontSize:'12px'}}>{r.changeable ? (r.certificate ? r.certificate.name : <span style={{color:'var(--accent-amber)'}}>Zscaler default</span>) : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </>
          )}
          {preview && (
            <div className="alert alert-info" style={{display:'block', marginTop:'1rem'}} data-sslpreview>
              <strong>Preview — nothing changed yet:</strong>
              {preview.results.map((r, i) => <div key={i} style={{fontSize:'12px'}}>{r.ok ? (r.unchanged ? '= ' : '→ ') : '✕ '}{r.name}: {r.unchanged ? `already ${r.after}` : r.ok ? `${r.before} → ${r.after}` : r.error}</div>)}
            </div>
          )}
          {result && (
            <div className={`alert ${result.results.every(r => r.ok) ? 'alert-success' : 'alert-warning'}`} style={{display:'block', marginTop:'1rem'}} data-sslresult>
              <strong>{result.results.filter(r => r.ok && !r.unchanged).length} rule(s) changed{result.activated ? ' and activated' : ''}.</strong>
              {result.results.map((r, i) => <div key={i} style={{fontSize:'12px'}}>{r.ok ? '✓' : '✕'} {r.name}: {r.ok ? `${r.before} → ${r.after}` : r.error}</div>)}
            </div>
          )}
          <div className="btn-group">
            <button className="btn btn-ghost" disabled={!ids.length || busy} onClick={() => run(true)} data-sslpreviewbtn>Preview change ({ids.length})</button>
            <button className="btn btn-success" disabled={!ids.length || busy || !preview} onClick={() => run(false)} data-sslapply>
              {busy ? <><span className="spinner"></span> Working…</> : `Apply to ${ids.length} rule${ids.length === 1 ? '' : 's'} and activate`}
            </button>
          </div>
          <div className="form-hint">To go back, choose "Zscaler default certificate", select the rules and apply. Every change is in the audit log.</div>
        </div>
      );
    }

    function CustomizeStep({ config, setConfig, setTemplate, setError, loading, setLoading, onNext, onBack, auth }) {
      const [profiles, setProfiles] = useState(null);
      const isDow = config.complianceFramework === 'DOW_STANDARD' && !config.baseTemplate;
      const base = config.baseTemplate ? config.baseTemplate.policies : null;
      const all = [
        { key: 'enableUrlFiltering', policy: 'urlFiltering', label: 'URL Filtering', desc: isDow ? 'DOW Block, Allow and Isolate rules (every unlisted category is isolated)' : 'Block / allow web categories', sheet: true },
        { key: 'enableAtp', policy: 'advancedThreatProtection', label: 'Advanced Threat Protection', desc: isDow ? 'P2P, cryptomining, botnet, compromised host, phishing, spam, and blocked countries' : 'ATP settings from the baseline (applied through the legacy API)', sheet: true },
        { key: 'enableIps', policy: 'ipsControl', label: 'IPS Control', desc: 'Block Command and Control (needs the Cloud Firewall IPS subscription)', sheet: true },
        { key: 'enableSandbox', policy: 'sandbox', label: 'Cloud Sandbox', desc: isDow ? 'Block Malware and Ransomware verdicts' : 'Quarantine & scan unknown files', sheet: true },
        { key: 'enableFileTypeControl', policy: 'fileTypeControl', label: 'File Type Control', desc: isDow ? 'Block Flash' : 'Block risky file types', sheet: true },
        { key: 'enableFirewall', policy: 'firewallFiltering', label: 'Cloud Firewall', desc: 'Network-level firewall filtering rules' },
        { key: 'enableSslInspection', policy: 'sslInspection', label: 'SSL/TLS Inspection', desc: isDow ? 'Exempt Health and Finance, then inspect everything else (TLS 1.2 minimum); choose the interception certificate below' : 'Inspect encrypted traffic', sheet: true },
        { key: 'enableDnsSecurity', policy: 'dnsSecurity', label: 'DNS Security', desc: 'Block malicious DNS categories and DNS tunnels' },
        { key: 'enableCloudAppControl', policy: 'cloudAppControl', label: 'Cloud App Control', desc: 'Control SaaS apps (DoH, file sharing, webmail, AI/ML, social, IM)' },
        { key: 'enableDlp', policy: 'dlp', label: 'Data Loss Prevention', desc: 'DLP rules (NIST 800-171 / 800-53 content). Default Allow with Incident Receiver; switch to Block on the next step.' },
        { key: 'enableMalwareProtection', policy: 'malwareProtection', label: 'Malware Protection settings (shown for review)', desc: 'Not applied by the API in this edition' },
        { key: 'enableAdvancedSettings', policy: 'advancedSettings', label: 'Advanced Cloud Settings (shown for review)', desc: 'Not applied by the API in this edition' }
      ];
      const list = base ? all.filter(t => base[t.policy]) : all.filter(t => isDow || t.key !== 'enableIps');
      const needsIsolation = (isDow && config.enableUrlFiltering !== false) || (base && (base.urlFiltering || []).some(r => r.action === 'ISOLATE'));
      const needsCert = config.enableSslInspection !== false && (!base || (base.sslInspection || []).some(r => r.action === 'DECRYPT' || r.action === 'INSPECT'));
      const [certs, reloadCerts] = useSslCertificates(needsCert && auth.connected);
      const [profTick, setProfTick] = useState(0);
      useEffect(() => {
        if (!needsIsolation || !auth.connected) return;
        setProfiles(null);
        api.call('GET', '/isolation-profiles').then(ps => {
          setProfiles(ps);
          if (!config.cbiProfile && ps.length) {
            // "Default Isolation Profile" is always present; use it unless a framework file named another one
            const byName = config.cbiProfileName && ps.find(p => p.name === config.cbiProfileName);
            const pickP = byName || ps.find(p => p.defaultProfile) || ps.find(p => /default isolation profile/i.test(p.name)) || ps[0];
            setConfig(c => ({ ...c, cbiProfile: { id: pickP.id, name: pickP.name, url: pickP.url } }));
          }
        }).catch(e => setProfiles({ error: e.message }));
      }, [needsIsolation, auth.connected, profTick]);
      useEffect(() => {
        // a framework file can carry the certificate by name; match it once the tenant's list is in
        if (certs && certs.certificates && config.sslCertificateName && !config.sslCertificate) {
          const c = certs.certificates.find(x => x.name === config.sslCertificateName);
          if (c) setConfig(cfg => ({ ...cfg, sslCertificate: { id: c.id, name: c.name } }));
        }
      }, [certs]);
      const Toggle = ({ k }) => (
        <div className={`toggle-switch ${config[k] !== false ? 'active' : ''}`} data-module={k} onClick={() => setConfig({ ...config, [k]: config[k] === false })}><div className="toggle-knob"></div></div>
      );
      const row = (t) => (
        <div className="toggle-item" key={t.key}>
          <div><label onClick={() => setConfig({ ...config, [t.key]: config[t.key] === false })}>{t.label}</label><div className="form-hint">{t.desc}</div></div>
          <Toggle k={t.key} />
        </div>
      );
      return (
        <div className="card">
          <div className="card-header">
            <h2>Customize</h2>
            <p>Naming prefix, which policy areas to include, and the isolation profile for isolated categories.</p>
          </div>
          <div className="form-group">
            <label className="form-label">Naming Prefix</label>
            <input type="text" value={config.prefix} onChange={e => setConfig({ ...config, prefix: e.target.value.replace(/[^A-Za-z0-9_-]/g, '') })} placeholder="GOV" />
            <div className="form-hint">{base ? 'Captured / loaded rules keep their own names.' : `New rules are named ${config.prefix || 'GOV'}-… (e.g. ${config.prefix || 'GOV'}-DOW-Block).`}</div>
          </div>
          {needsIsolation && (
            <div className="form-group" data-isolation>
              <label className="form-label">Cloud Browser Isolation profile (for isolated categories)</label>
              {!auth.connected ? <div className="form-hint">Connect to pick a profile.</div>
               : !profiles ? <div className="form-hint"><span className="spinner"></span> Reading profiles…</div>
               : profiles.error ? <div className="alert alert-warning">Could not read isolation profiles: {profiles.error}</div>
               : profiles.length === 0 ? <div className="alert alert-danger" style={{display:'block'}}>This tenant has no isolation profile. Create one in the Isolation admin portal (the ZIA API can only read profiles), then come back — or switch the Isolate rule off on the next step.</div>
               : (
                <div style={{display:'flex', gap:'8px'}}>
                  <select style={{flex:1}} value={config.cbiProfile ? config.cbiProfile.id : ''} onChange={e => { const p = profiles.find(x => String(x.id) === e.target.value); setConfig({ ...config, cbiProfile: p ? { id: p.id, name: p.name, url: p.url } : null }); }}>
                    {profiles.map(p => <option key={p.id} value={p.id}>{p.name}{p.defaultProfile ? ' (default)' : ''}</option>)}
                  </select>
                  <button className="btn btn-ghost btn-sm" onClick={() => setProfTick(t => t + 1)} title="Fetch the profiles again (picks up ones created in the Isolation portal)" data-refreshprofiles>↻ Refresh</button>
                </div>
              )}
              {Array.isArray(profiles) && profiles.length > 0 && <div className="form-hint">Uses the Default Isolation Profile unless you pick another. Created a new one in the Isolation portal? Click Refresh.</div>}
            </div>
          )}
          {needsCert && (
            <div className="form-group" data-sslcert>
              <label className="form-label">SSL interception certificate (for the Inspect rules this creates)</label>
              {!auth.connected ? <div className="form-hint">Connect to list certificates.</div> : (
                <CertificatePicker value={config.sslCertificate || null} onChange={(c) => setConfig({ ...config, sslCertificate: c })} certs={certs} reload={reloadCerts} testId="customize" />
              )}
              <div className="form-hint">Change existing SSL rules in bulk from ZIA › SSL Certificate Manager.</div>
            </div>
          )}
          <div className="form-group">
            <label className="form-label">{isDow ? 'DOW Standard sections' : 'Policy Modules'}</label>
            <div className="toggle-group">{list.filter(t => !isDow || t.sheet).map(row)}</div>
          </div>
          {isDow && (
            <div className="form-group">
              <label className="form-label">Optional — add NIST 800-53 Strict baseline modules</label>
              <div className="form-hint" style={{marginTop:0, marginBottom:'8px'}}>Not part of the DOW sheet; off by default.</div>
              <div className="toggle-group">{list.filter(t => !t.sheet).map(row)}</div>
            </div>
          )}
          <div className="btn-group">
            <button className="btn btn-ghost" onClick={onBack}>← Back</button>
            <button className="btn btn-primary" onClick={onNext} data-next>Next: Rules →</button>
          </div>
        </div>
      );
    }

    // ========================
    // Step: Rules — on/off for every rule and setting, Allow/Block where it applies
    // ========================
    const isRestrictiveAction = (a) => /(^|,\s*)(BLOCK|DENY|CAUTION|ISOLATE)/.test(a || '');
    const isBlockAction = (a) => /(^|,\s*)(BLOCK|DENY)/.test(a || '');
    const COUNTRY_NAMES = { COUNTRY_CN: 'China', COUNTRY_RU: 'Russia', COUNTRY_IR: 'Iran', COUNTRY_IQ: 'Iraq', COUNTRY_SO: 'Somalia', COUNTRY_KP: 'North Korea',
      COUNTRY_SY: 'Syria', COUNTRY_CU: 'Cuba', COUNTRY_VE: 'Venezuela', COUNTRY_BY: 'Belarus', COUNTRY_AF: 'Afghanistan', COUNTRY_YE: 'Yemen', COUNTRY_LY: 'Libya', COUNTRY_SD: 'Sudan', COUNTRY_MM: 'Myanmar' };

    function ActionsStep({ config, setConfig, setTemplate, setError, loading, setLoading, onNext, onBack }) {
      const [catalog, setCatalog] = useState(null);
      const [open, setOpen] = useState({});
      const [newCountry, setNewCountry] = useState('');
      const settings = config.actionSettings || { policy: {}, rules: {} };
      const disabledRules = config.disabledRules || {};
      const disabledSettings = config.disabledSettings || {};

      const catalogKey = JSON.stringify([config.tier, config.complianceFramework, config.prefix, !!config.baseTemplate, config.loadedFramework && config.loadedFramework.savedAt,
        config.enableUrlFiltering, config.enableFirewall, config.enableDnsSecurity, config.enableFileTypeControl, config.enableCloudAppControl, config.enableDlp,
        config.enableSslInspection, config.enableSandbox, config.enableAtp, config.enableIps]);
      useEffect(() => {
        let cancelled = false;
        setCatalog(null);
        api.call('POST', '/templates/action-catalog', config).then(c => { if (!cancelled) setCatalog(c); }).catch(e => setError(e.message));
        return () => { cancelled = true; };
      }, [catalogKey]);

      const update = (policy, rules) => setConfig({ ...config, actionSettings: { policy, rules } });
      const setPolicy = (type, value) => {
        const rules = { ...settings.rules };
        Object.keys(rules).forEach(k => { if (k.startsWith(type + ':')) delete rules[k]; });
        update({ ...settings.policy, [type]: value }, rules);
      };
      const baseFor = (r) => r.defaultAction === 'ALLOW' ? 'ALLOW' : isBlockAction(r.defaultAction) ? 'BLOCK' : null;
      const setRule = (type, rule, value) => {
        const rules = { ...settings.rules };
        const p = settings.policy[type];
        const inherited = (p === 'ALLOW' || p === 'BLOCK') ? p : baseFor(rule);
        if (value === inherited) delete rules[rule.key]; else rules[rule.key] = value;
        update(settings.policy, rules);
      };
      const effective = (type, r) => {
